# Base view "weather station" for the 7" display
# The display ONLY reads these sensor.ws_* entities. Changing a source = change one line here,
# the display does not need to be reflashed.
#
# ── ADAPT ──────────────────────────────────────────────────────────────
#   sensor.outdoor_temperature   outdoor temperature (any sensor; 4 occurrences in the max/min block)
#   weather entity: nothing to do – the blueprints pick the first available one and fall back
#                   automatically (e.g. Met.no 503). With several weather services set weather_entity.
#   sensor.indoor_temperature / sensor.indoor_humidity   the room the display hangs in
#   Display at night: blueprint "Wall tiles: display brightness by time of day" (night mode).
template:
  # ---------- outdoor ----------
  - sensor:
      - name: "WS Outdoor Temp"
        unique_id: ws_outdoor_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('sensor.outdoor_temperature') | float(none) }}"
        availability: "{{ states('sensor.outdoor_temperature') | is_number }}"

  - name: "WS Outdoor Humidity"
    unique_id: ws_outdoor_humidity
    use_blueprint:
      path: wall_tiles/weather_value.yaml
      input:
        # weather_entity: weather.home   # optional, only needed with several weather services
        attribute: humidity

  # max/min outdoor since midnight (resets to the current value at 0:00)
  - triggers:
      - trigger: state
        entity_id: sensor.outdoor_temperature
      - trigger: time
        at: "00:00:00"
        id: reset
      - trigger: homeassistant
        event: start
      # right after "reload template entities" and regularly, otherwise max/min
      # stays unknown until the outdoor temperature changes
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: "/10"
    sensor:
      - name: "WS Outdoor Max"
        unique_id: ws_outdoor_max
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set t = states('sensor.outdoor_temperature') | float(none) %}
          {% set old = this.state | float(none) if this is defined else none %}
          {% if t is none %}{{ old }}
          {% elif trigger.id == 'reset' or old is none %}{{ t }}
          {% else %}{{ [t, old] | max }}{% endif %}
      - name: "WS Outdoor Min"
        unique_id: ws_outdoor_min
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set t = states('sensor.outdoor_temperature') | float(none) %}
          {% set old = this.state | float(none) if this is defined else none %}
          {% if t is none %}{{ old }}
          {% elif trigger.id == 'reset' or old is none %}{{ t }}
          {% else %}{{ [t, old] | min }}{% endif %}

  # ---------- indoor ----------
  - sensor:
      - name: "WS Indoor Temp"
        unique_id: ws_indoor_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('sensor.indoor_temperature') | float(none) }}"
        availability: "{{ states('sensor.indoor_temperature') | is_number }}"

      - name: "WS Indoor Humidity"
        unique_id: ws_indoor_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: "{{ states('sensor.indoor_humidity') | float(none) }}"
        availability: "{{ states('sensor.indoor_humidity') | is_number }}"

      # comfort: gut | trocken | feucht | kalt | warm | unbekannt  (display shows a smiley)
      - name: "WS Comfort"
        unique_id: ws_comfort
        icon: mdi:emoticon-outline
        state: >
          {% set t = states('sensor.indoor_temperature') | float(none) %}
          {% set h = states('sensor.indoor_humidity') | float(none) %}
          {% if t is none or h is none %}unbekannt
          {% elif t < 19 %}kalt
          {% elif t > 25 %}warm
          {% elif h < 35 %}trocken
          {% elif h > 60 %}feucht
          {% else %}gut{% endif %}

  # ---------- forecast today (every 15 min) ----------
  # state = HA weather condition (sunny, rainy …); attributes text, symbol, temp_max, temp_min, rain
  - name: "WS Forecast"
    unique_id: ws_forecast
    use_blueprint:
      path: wall_tiles/weather_forecast_today.yaml
      # optional, only needed with several weather services:
      # input:
      #   weather_entity: weather.home

  # ---------- sun (HH:MM text, local time) ----------
  - sensor:
      - name: "WS Sunrise"
        unique_id: ws_sunrise
        icon: mdi:weather-sunset-up
        state: >
          {% set t = state_attr('sun.sun', 'next_rising') %}
          {{ as_local(as_datetime(t)).strftime('%H:%M') if t else '' }}
      - name: "WS Sunset"
        unique_id: ws_sunset
        icon: mdi:weather-sunset-down
        state: >
          {% set t = state_attr('sun.sun', 'next_setting') %}
          {{ as_local(as_datetime(t)).strftime('%H:%M') if t else '' }}
