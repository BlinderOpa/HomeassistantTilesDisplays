# Tile: rain is coming
#   Visible 6–22 h while it is NOT raining but rain is expected within the next 2 hours.
#   Set show_while_raining: true to keep it visible while it rains ("regnet bis 15:00").
#   An hour counts as wet from 0.2 mm or 50 % probability.
#   Source: hourly forecast of the weather entity, polled every 10 min.
#
# ── ADAPT ──────────────────────────────────────────────────────────────
#   Nothing for a single weather integration: the blueprint "rain soon" picks the first
#   available weather entity with hourly forecast and falls back automatically if it is
#   unavailable. With several weather integrations set weather_entity below.
template:
  - name: "Rain Soon"
    unique_id: rain_soon
    use_blueprint:
      path: wall_tiles/rain_soon.yaml
      # optional, only needed with several weather services:
      # input:
      #   weather_entity: weather.home
  - name: "Tile Rain"
    unique_id: tile_rain
    use_blueprint:
      path: wall_tiles/tile_rain.yaml
      input:
        rain_soon_entity: sensor.rain_soon
        show_while_raining: true
