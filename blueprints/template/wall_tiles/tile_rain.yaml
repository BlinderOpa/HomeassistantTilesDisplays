blueprint:
  name: "Wall tiles: rain is coming"
  description: >
    Tile that warns when rain is expected soon while it is not raining yet (laundry, windows).
    Based on the helper sensor from the blueprint "rain soon", so it needs no weather entity itself.
    Visible inside a time window only.
    Optional: stay visible while it rains and show until when ("regnet bis 15:00").
  domain: template
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/template/wall_tiles/tile_rain.yaml
  input:
    rain_soon_entity:
      name: Rain-soon helper sensor
      default: sensor.rain_soon
      selector: {entity: {domain: sensor}}
    time_from:
      name: Visible from
      default: "06:00:00"
      selector: {time: {}}
    time_to:
      name: Visible until
      default: "22:00:00"
      selector: {time: {}}
    show_while_raining:
      name: Show while it rains
      description: >
        Off = the tile disappears as soon as it rains (default).
        On = "Regen · regnet bis HH:MM" while it rains ("noch länger" if no dry hour within 12 h).
      default: false
      selector: {boolean: {}}
    prio:
      name: Priority
      default: 22
      selector: {number: {min: 0, max: 99}}

variables:
  rs: !input rain_soon_entity
  t_from: !input time_from
  t_to: !input time_to
  prio_: !input prio
  show_rain: !input show_while_raining

sensor:
  icon: mdi:weather-rainy
  state: >
    {% set m = states(rs) | int(-1) %}
    {% set n = now().strftime('%H:%M:%S') %}
    {% set window = (t_from <= n < t_to) if t_from <= t_to else (n >= t_from or n < t_to) %}
    {% set raining = state_attr(rs, 'raining') in [true, 'True', 'true'] %}
    {% if not window %}hidden
    {% elif raining %}{{ 'info' if show_rain else 'hidden' }}
    {% elif m >= 0 %}warn
    {% else %}hidden{% endif %}
  attributes:
    prio: "{{ prio_ | int }}"
    title: >
      {{ 'Regen' if state_attr(rs, 'raining') in [true, 'True', 'true'] else 'Regen kommt' }}
    value: >
      {% set m = states(rs) | int(-1) %}
      {% set e = state_attr(rs, 'end') or '' %}
      {% if state_attr(rs, 'raining') in [true, 'True', 'true'] %}
        {{ 'regnet bis ' ~ e if e else 'regnet noch länger' }}
      {% else %}
        {{ 'gleich' if m <= 10 else 'ab ' ~ state_attr(rs, 'start') }}
      {% endif %}
    detail: >
      {% set mm = state_attr(rs, 'mm') | float(0) %}
      {% set amount = 'ca. ' ~ (mm | string | replace('.', ',')) ~ ' mm' if mm >= 0.5 else '' %}
      {% if state_attr(rs, 'raining') in [true, 'True', 'true'] %}
        {{ amount }}
      {% else %}
        {{ (amount ~ ' · ' if amount else '') ~ 'Wäsche/Fenster?' }}
      {% endif %}
    progress: -1
    tap: "none"
