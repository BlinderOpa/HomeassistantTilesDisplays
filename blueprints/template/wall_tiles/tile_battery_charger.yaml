blueprint:
  name: "Wall tiles: battery charger on a smart plug"
  description: >
    For an AA/AAA charger (or similar) on a smart plug. Visible while the plug is on;
    tapping switches it off. Shows how many cells are still charging, estimated from
    the AVERAGE power (create a "Statistics" helper: mean/average step, max age 5 min,
    from the plug's power sensor – many chargers pulse, the raw value jumps).
    "voll" once the average is below the threshold and the plug has been on for 5 minutes.
  domain: template
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/template/wall_tiles/tile_battery_charger.yaml
  input:
    switch_entity:
      name: Smart plug
      selector: {entity: {domain: switch}}
    avg_power_entity:
      name: Average power (Statistics helper, W)
      selector: {entity: {domain: sensor}}
    watts_per_cell:
      name: Power per charging cell (W)
      default: 1.9
      selector: {number: {min: 0.1, max: 20, step: 0.1, unit_of_measurement: W}}
    full_below:
      name: Full below (W)
      default: 0.3
      selector: {number: {min: 0, max: 10, step: 0.1, unit_of_measurement: W}}
    drawer_entity:
      name: Drawer / lid contact (optional, on = open)
      default: ""
      selector: {entity: {domain: binary_sensor}}
    title:
      name: Title
      default: "Akkus"
      selector: {text: {}}
    prio:
      name: Priority
      default: 41
      selector: {number: {min: 0, max: 99}}

variables:
  sw: !input switch_entity
  avg: !input avg_power_entity
  wpc: !input watts_per_cell
  full_w: !input full_below
  drawer: !input drawer_entity
  title_: !input title
  prio_: !input prio

sensor:
  icon: mdi:battery-charging
  state: >
    {% set w = states(avg) | float(0) %}
    {% set on_for = (now() - states[sw].last_changed).total_seconds() if states[sw] is not none else 0 %}
    {% if not is_state(sw, 'on') %}hidden
    {% elif w >= full_w | float %}info
    {% elif on_for >= 300 %}ok
    {% else %}info{% endif %}
  attributes:
    prio: "{{ prio_ | int }}"
    title: "{{ title_ }}"
    value: >
      {% set w = states(avg) | float(0) %}
      {% set on_for = (now() - states[sw].last_changed).total_seconds() if states[sw] is not none else 0 %}
      {% if w >= full_w | float %}lädt · noch {{ [((w / wpc | float) | round(0) | int), 1] | max }}
      {% elif on_for >= 300 %}voll
      {% else %}startet{% endif %}
    detail: >
      {% set w = states(avg) | float(0) %}
      {% set on_for = (now() - states[sw].last_changed).total_seconds() if states[sw] is not none else 0 %}
      {% if w >= full_w | float %}{{ ('%.1f' | format(w)) | replace('.', ',') }} W
      {% elif on_for < 300 %}
      {% elif drawer and is_state(drawer, 'on') %}Schublade schließen
      {% else %}Antippen schaltet aus{% endif %}
    progress: -1
    tap: "toggle"
    entity: "{{ sw }}"
