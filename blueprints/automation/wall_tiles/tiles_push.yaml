blueprint:
  name: "Wall tiles: push tiles to all displays"
  description: >
    Sends the tile list from sensor.wall_tiles (package tiles_collector.yaml) to every ESPHome
    device that can show tiles – found automatically via its sensor "Display-Info"
    (tiles=full → complete list, tiles=compact → only id, tap, status, title, value, detail).
    No device names needed: one automation for all displays.
    Runs on every change, after the debug switch, on HA start and when a device reports
    "esphome.display_ready" (then only that device is updated).

    Which tile appears where is decided by the labels of the tile: "Display" = on every display,
    "Display <device>" = only on that device, where <device> is the ESPHome node name or the
    device name in HA (case, spaces, "_" and "-" don't matter).
  domain: automation
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/automation/wall_tiles/tiles_push.yaml
  input:
    max_tiles:
      name: Max. number of tiles per display
      default: 12
      selector:
        number:
          min: 1
          max: 12

mode: queued
max: 5

triggers:
  - trigger: state
    entity_id: sensor.wall_tiles
    attribute: tiles
  - trigger: state
    entity_id: input_boolean.wall_tiles_debug
  - trigger: event
    event_type: esphome.display_ready
    id: ready
  - trigger: homeassistant
    event: start

variables:
  max_: !input max_tiles
  debug: "{{ is_state('input_boolean.wall_tiles_debug', 'on') }}"
  # all devices that report themselves via sensor "Display-Info" (interface 4.10)
  devices: >
    {% set ns = namespace(l=[]) %}
    {% for e in integration_entities('esphome')
         if e.startswith('sensor.') and e.endswith('_display_info') %}
      {% set s = states(e) %}
      {% set node = s | regex_findall('node=([^;]+)') | first | default('') %}
      {% if node %}
        {% set size = s | regex_findall('size=([^;]+)') | first | default('') %}
        {% set tiles = s | regex_findall('tiles=([^;]+)') | first | default('no') %}
        {% set ns.l = ns.l + [{
          'node': node,
          'name': device_attr(device_id(e), 'name') or node,
          'size': size,
          'tiles': ('compact' if size in ['small', 'medium'] else 'full') if tiles == 'yes' else tiles,
          'background': s | regex_findall('background=([^;]+)') | first | default('no'),
          'calendar': s | regex_findall('calendar=([^;]+)') | first | default('no')
        }] %}
      {% endif %}
    {% endfor %}
    {{ ns.l }}
  targets: >
    {% set only = trigger.event.data.device if trigger.id == 'ready' else '' %}
    {{ devices | selectattr('tiles', 'in', ['full', 'compact'])
               | selectattr('node', 'in', [only] if only else (devices | map(attribute='node') | list))
               | list }}

actions:
  - delay: 2   # collect a moment if several tiles change at once
  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            d: "{{ repeat.item }}"
            mine_names: >
              {{ [d.node, d.name] | map('lower') | map('replace', '_', '-')
                 | map('replace', ' ', '-') | unique | list }}
            payload: >
              {% set ns = namespace(l=[]) %}
              {% for k in (state_attr('sensor.wall_tiles', 'tiles') or []) %}
                {% set mine = '*' in k.displays or (mine_names | select('in', k.displays) | list | count > 0) %}
                {% if mine or debug %}
                  {% set hint = '' if mine else '[anderes Display] ' %}
                  {% set detail = (hint ~ k.detail) | truncate(40, true, '') %}
                  {% if d.tiles == 'compact' %}
                    {% set ns.l = ns.l + [{'id': k.id, 'tap': k.tap, 'status': k.status if mine else 'off',
                                           'title': k.title, 'value': k.value, 'detail': detail}] %}
                  {% else %}
                    {% set ns.l = ns.l + [{'id': k.id, 'status': k.status if mine else 'off', 'icon': k.icon,
                                           'title': k.title, 'value': k.value, 'detail': detail,
                                           'prio': k.prio, 'tap': k.tap, 'progress': k.progress,
                                           'mini_icon': k.mini_icon}] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.l[:max_ | int] | to_json }}
        - action: "esphome.{{ d.node | replace('-', '_') }}_set_tiles"
          continue_on_error: true   # device may be offline
          data:
            tiles: "{{ payload }}"
