blueprint:
  name: "Wall tiles: push tiles to an ESPHome display"
  description: >
    Sends the tile list from sensor.wall_tiles (package tiles_collector.yaml) to one ESPHome
    device via its API action "set_tiles" – on every change, after the debug switch,
    on HA start and when the device reports "esphome.display_ready".

    Create one automation per display. Which tile appears on which display is decided by the
    labels of the tile: "Display" = on every display, "Display <device>" = only on that device.
    "Compact" sends only id, tap, status, title, value, detail (saves RAM on small devices).
  domain: automation
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/automation/wall_tiles/tiles_push.yaml
  input:
    node_name:
      name: ESPHome node name
      description: >
        As in the device YAML (esphome: name:), e.g. "wall-display".
        The action called is esphome.<node_name with - replaced by _>_set_tiles.
      selector:
        text:
    display_name:
      name: Name in the tile labels
      description: >
        The <device> part of the labels "Display <device>" (case, "_" and "-" don't matter).
        Empty = the ESPHome node name.
      default: ""
      selector:
        text:
    compact:
      name: Compact payload (small displays)
      default: false
      selector:
        boolean:
    max_tiles:
      name: Max. number of tiles
      default: 12
      selector:
        number:
          min: 1
          max: 12

mode: restart

triggers:
  - trigger: state
    entity_id: sensor.wall_tiles
    attribute: tiles
  - trigger: state
    entity_id: input_boolean.wall_tiles_debug
  - trigger: event
    event_type: esphome.display_ready
    event_data:
      device: !input node_name
  - trigger: homeassistant
    event: start

variables:
  node: !input node_name
  compact_: !input compact
  max_: !input max_tiles
  dname_: !input display_name
  me: "{{ ((dname_ | trim) if (dname_ | trim) != '' else node) | lower | replace('_', '-') | replace(' ', '-') }}"
  debug: "{{ is_state('input_boolean.wall_tiles_debug', 'on') }}"
  service: "esphome.{{ node | replace('-', '_') }}_set_tiles"
  payload: >
    {% set ns = namespace(l=[]) %}
    {% for k in (state_attr('sensor.wall_tiles', 'tiles') or []) %}
      {% set mine = '*' in k.displays or me in k.displays %}
      {% if mine or debug %}
        {% set hint = '' if mine else '[anderes Display] ' %}
        {% set detail = (hint ~ k.detail) | truncate(40, true, '') %}
        {% if compact_ %}
          {% set ns.l = ns.l + [{'id': k.id, 'tap': k.tap, 'status': k.status if mine else 'off',
                                 'title': k.title, 'value': k.value, 'detail': detail}] %}
        {% else %}
          {% set ns.l = ns.l + [{'id': k.id, 'status': k.status if mine else 'off', 'icon': k.icon,
                                 'title': k.title, 'value': k.value, 'detail': detail,
                                 'prio': k.prio, 'tap': k.tap, 'progress': k.progress,
                                 'mini_icon': k.mini_icon}] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.l[:max_ | int] | to_json }}

actions:
  - delay: 2   # collect a moment if several tiles change at once
  - action: "{{ service }}"
    continue_on_error: true   # device may be offline
    data:
      tiles: "{{ payload }}"
