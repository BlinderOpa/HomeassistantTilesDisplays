blueprint:
  name: "Wall tiles: special alarm (one-off wake-up)"
  description: >
    Runs your existing wake automation (e.g. light alarm) once at the time of a special alarm,
    so the light logic stays in one place. The wake automation is started with
    automation.trigger and skip_condition, so its own conditions (workdays, holidays …) do not block it.

    Also manages the flag "special alarm active":
      - the special time is changed (e.g. on the phone) and lies in the future → flag on
      - at the reset time (default 12:00) and after a restart: special time in the past → flag off.
        Until then sensor.alarm_next reports special_today = true, so the regular alarm of that day
        can be suppressed in your wake automation:
          condition: template
          value_template: "{{ not state_attr('sensor.alarm_next', 'special_today') }}"
  domain: automation
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/automation/wall_tiles/alarm_special.yaml
  input:
    special_time:
      name: Special alarm (input_datetime with date and time)
      selector: {entity: {domain: input_datetime}}
    special_active:
      name: Special alarm active (input_boolean)
      selector: {entity: {domain: input_boolean}}
    wake_automation:
      name: Your wake automation (started at the special time)
      selector: {entity: {domain: automation}}
    reset_time:
      name: Reset time on the day of the special alarm
      default: "12:00:00"
      selector: {time: {}}

mode: queued

triggers:
  - trigger: time
    at: !input special_time
    id: wake
  - trigger: state
    entity_id: !input special_time
    id: changed
  - trigger: time
    at: !input reset_time
    id: cleanup
  - trigger: homeassistant
    event: start
    id: cleanup

variables:
  sp_time: !input special_time
  sp_on: !input special_active
  wake: !input wake_automation
  ts: "{{ state_attr(sp_time, 'timestamp') | float(0) }}"

actions:
  - choose:
      - conditions: "{{ trigger.id == 'wake' and is_state(sp_on, 'on') }}"
        sequence:
          - action: automation.trigger
            target:
              entity_id: "{{ wake }}"
            data:
              skip_condition: true
      - conditions: "{{ trigger.id == 'changed' and ts > as_timestamp(now()) }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ sp_on }}"
      - conditions: "{{ trigger.id == 'cleanup' and ts < as_timestamp(now()) and is_state(sp_on, 'on') }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ sp_on }}"
