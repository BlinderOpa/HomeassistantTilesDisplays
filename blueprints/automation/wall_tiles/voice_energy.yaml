blueprint:
  name: 'Wall tiles voice: home battery, PV and "Lohnt sich Waschen?"'
  description: >
    Three voice questions in one automation: how full is the home battery, what does the PV
    produce, and is it a good time to run the washing machine (surplus, battery, forecast).
    Values above 50 are treated as W and converted to kW.
  domain: automation
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/automation/wall_tiles/voice_energy.yaml
  input:
    soc_entity:
      name: Home battery level (%)
      selector: {entity: {domain: sensor}}
    pv_entity:
      name: PV production (W or kW)
      selector: {entity: {domain: sensor}}
    house_entity:
      name: House consumption (W or kW)
      selector: {entity: {domain: sensor}}
    export_entity:
      name: Grid export (W, optional)
      default: ""
      selector: {entity: {domain: sensor}}
    import_entity:
      name: Grid import (W, optional)
      default: ""
      selector: {entity: {domain: sensor}}
    rest_today_entity:
      name: Forecast remaining today (kWh, optional – Forecast.Solar / Solcast)
      default: ""
      selector: {entity: {domain: sensor}}
    tomorrow_entity:
      name: Forecast tomorrow (kWh, optional)
      default: ""
      selector: {entity: {domain: sensor}}
    surplus_yes:
      name: '"Waschen: ja" from surplus (kW)'
      default: 1.5
      selector: {number: {min: 0.2, max: 10, step: 0.1}}
    battery_yes:
      name: '"Waschen: ja" from battery level (%) with some sun'
      default: 80
      selector: {number: {min: 10, max: 100}}
    battery_ok:
      name: '"Waschen: geht" from battery level (%)'
      default: 60
      selector: {number: {min: 10, max: 100}}
    rest_wait:
      name: '"Besser warten" from remaining forecast (kWh, mornings)'
      default: 4
      selector: {number: {min: 0, max: 50}}
    s_battery:
      name: Sentences – battery
      default: ["Speicher", "Wie voll ist der (Speicher | Akku | Hausspeicher)", "Wie ist der (Speicher | Akku | Hausspeicher)"]
      selector: {text: {multiple: true}}
    s_pv:
      name: Sentences – PV
      default: ["Solar", "Solaranlage", "Wie viel Strom (machen | erzeugen) wir [gerade]", "Was (macht | bringt) die (Solaranlage | PV)"]
      selector: {text: {multiple: true}}
    s_laundry:
      name: Sentences – laundry
      default: ["Lohnt sich [jetzt] Waschen", "Kann ich [jetzt] waschen", "Ist genug (Strom | Sonne) [zum Waschen] da"]
      selector: {text: {multiple: true}}

mode: parallel

triggers:
  - trigger: conversation
    id: battery
    command: !input s_battery
  - trigger: conversation
    id: pv
    command: !input s_pv
  - trigger: conversation
    id: laundry
    command: !input s_laundry

variables:
  soc_e: !input soc_entity
  pv_e: !input pv_entity
  house_e: !input house_entity
  exp_e: !input export_entity
  imp_e: !input import_entity
  rest_e: !input rest_today_entity
  tom_e: !input tomorrow_entity
  surplus_yes: !input surplus_yes
  battery_yes: !input battery_yes
  battery_ok: !input battery_ok
  rest_wait: !input rest_wait
  soc: >
    {% set v = states(soc_e) %}
    {{ v | float | round(0) | int if v | is_number else -1 }}
  pv: >
    {% set v = states(pv_e) | float(0) %}
    {{ (v / 1000 if v > 50 else v) | round(1) }}
  house: >
    {% set v = states(house_e) | float(0) %}
    {{ (v / 1000 if v > 50 else v) | round(1) }}
  surplus: "{{ [pv - house, 0] | max | round(1) }}"
  export_w: "{{ states(exp_e) | float(0) | round(0) | int if exp_e else 0 }}"
  import_w: "{{ states(imp_e) | float(0) | round(0) | int if imp_e else 0 }}"
  rest_today: "{{ states(rest_e) | float(-1) | round(0) | int if rest_e else -1 }}"
  kwh_tomorrow: "{{ states(tom_e) | float(-1) | round(0) | int if tom_e else -1 }}"
  pv_s: "{{ '%.1f' | format(pv) | replace('.', ',') }}"
  house_s: "{{ '%.1f' | format(house) | replace('.', ',') }}"
  surplus_s: "{{ '%.1f' | format(surplus) | replace('.', ',') }}"
  wash: >
    {% if surplus >= surplus_yes | float %}yes
    {% elif soc >= battery_yes | int and pv >= 0.5 %}yes_battery
    {% elif rest_today >= rest_wait | int and now().hour < 13 %}wait
    {% elif soc >= battery_ok | int %}ok
    {% else %}no{% endif %}

actions:
  - choose:
      - conditions: "{{ trigger.id == 'battery' }}"
        sequence:
          - action: script.display_answer
            continue_on_error: true
            data:
              target: "{{ trigger.device_id }}"
              title: "Speicher"
              value: "{{ (soc ~ ' %') if soc >= 0 else '--' }}"
              detail: >
                {% if export_w > 100 %}Einspeisung {{ export_w }} W
                {% elif import_w > 100 %}Netzbezug {{ import_w }} W{% endif %}
              status: "{{ 'warn' if 0 <= soc < 20 else 'info' }}"
              icon: solar-power
          - set_conversation_response: >
              {% if soc < 0 %}Ich habe gerade keine Werte vom Speicher.
              {% else %}Der Speicher ist zu {{ soc }} Prozent voll.{% if export_w > 100 %} Wir speisen gerade {{ export_w }} Watt ein.{% elif import_w > 100 %} Wir beziehen gerade {{ import_w }} Watt aus dem Netz.{% endif %}{% endif %}

      - conditions: "{{ trigger.id == 'pv' }}"
        sequence:
          - action: script.display_answer
            continue_on_error: true
            data:
              target: "{{ trigger.device_id }}"
              title: "Solar"
              value: "{{ pv_s }} kW"
              detail: "{{ ['Haus ' ~ house_s ~ ' kW', ('noch ' ~ rest_today ~ ' kWh') if rest_today > 0 else ''] | select | join(' · ') }}"
              status: info
              icon: solar-power
          - set_conversation_response: >
              {% if pv < 0.05 %}Die Solaranlage liefert gerade nichts.
              {% else %}Die Solaranlage liefert gerade {{ pv_s }} Kilowatt, das Haus braucht {{ house_s }} Kilowatt.{% endif %}
              {%- if is_state('sun.sun', 'above_horizon') and rest_today > 0 %} Heute kommen noch etwa {{ rest_today }} Kilowattstunden.
              {%- elif kwh_tomorrow >= 0 %} Morgen sind etwa {{ kwh_tomorrow }} Kilowattstunden angesagt.{% endif %}

      - conditions: "{{ trigger.id == 'laundry' }}"
        sequence:
          - action: script.display_answer
            continue_on_error: true
            data:
              target: "{{ trigger.device_id }}"
              title: "Waschen?"
              value: "{{ {'yes': 'ja', 'yes_battery': 'ja', 'wait': 'später', 'ok': 'geht', 'no': 'eher nicht'}[wash] }}"
              detail: "PV {{ pv_s }} kW · Speicher {{ soc }} %"
              status: "{{ {'yes': 'ok', 'yes_battery': 'ok', 'wait': 'warn', 'ok': 'ok', 'no': 'info'}[wash] }}"
              icon: washing-machine
          - set_conversation_response: >
              {% if wash == 'yes' %}Ja, gerade gibt es {{ surplus_s }} Kilowatt Überschuss.
              {% elif wash == 'yes_battery' %}Ja, der Speicher ist zu {{ soc }} Prozent voll und die Sonne scheint.
              {% elif wash == 'wait' %}Besser noch warten, heute kommen noch etwa {{ rest_today }} Kilowattstunden Sonnenstrom.
              {% elif wash == 'ok' %}Geht, der Speicher ist zu {{ soc }} Prozent voll.
              {% else %}Eher nicht, gerade gibt es wenig Sonnenstrom.{% if kwh_tomorrow >= 10 %} Morgen sind etwa {{ kwh_tomorrow }} Kilowattstunden angesagt.{% endif %}{% endif %}
