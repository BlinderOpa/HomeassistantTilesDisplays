blueprint:
  name: "Wall tiles: display brightness by time of day"
  description: >
    Sets the brightness of one display light (e.g. the backlight light entity of a voice
    satellite): bright during the day, dimmed after sunset, dark at night (0 % = off).
    Create one automation per light. No device names needed.
    Runs at sunrise/sunset, at the night start/end times, on HA start and when the light
    comes back after a restart of the device.

    Night mode (backlight off, a tap wakes the display): switch "Display Nachtmodus" of the
    device – switch it with a simple time automation of your own.
    The 7" wall display has no brightness (its backlight is on/off only): use its night mode.
  domain: automation
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/automation/wall_tiles/display_brightness.yaml
  input:
    light_entity:
      name: Display light
      description: The light entity of the display backlight (or a number entity 0–100).
      selector:
        entity:
          domain: [light, number]
    day:
      name: Day brightness (%)
      default: 80
      selector: {number: {min: 0, max: 100, unit_of_measurement: "%"}}
    evening:
      name: Evening brightness (%, after sunset)
      default: 40
      selector: {number: {min: 0, max: 100, unit_of_measurement: "%"}}
    night:
      name: Night brightness (%, 0 = off)
      default: 10
      selector: {number: {min: 0, max: 100, unit_of_measurement: "%"}}
    night_start:
      name: Night starts
      default: "22:00:00"
      selector: {time: {}}
    night_end:
      name: Night ends
      default: "06:00:00"
      selector: {time: {}}

mode: restart

triggers:
  - trigger: sun
    event: sunrise
  - trigger: sun
    event: sunset
  - trigger: time
    at: !input night_start
  - trigger: time
    at: !input night_end
  - trigger: homeassistant
    event: start
  # device restarted / reconnected
  - trigger: state
    entity_id: !input light_entity
    from: unavailable

variables:
  ent: !input light_entity
  day_: !input day
  evening_: !input evening
  night_: !input night
  ns_: !input night_start
  ne_: !input night_end
  is_night: >
    {% set t = now().strftime('%H:%M:%S') %}
    {{ (t >= ns_ or t < ne_) if ns_ > ne_ else (ns_ <= t < ne_) }}
  value: >
    {% if is_night %}{{ night_ }}
    {% elif is_state('sun.sun', 'above_horizon') %}{{ day_ }}
    {% else %}{{ evening_ }}{% endif %}

actions:
  - choose:
      - conditions: "{{ ent.startswith('number.') }}"
        sequence:
          - action: number.set_value
            target: {entity_id: "{{ ent }}"}
            data: {value: "{{ value }}"}
      - conditions: "{{ value | int(0) <= 0 }}"
        sequence:
          - action: light.turn_off
            target: {entity_id: "{{ ent }}"}
    default:
      - action: light.turn_on
        target: {entity_id: "{{ ent }}"}
        data: {brightness_pct: "{{ value | int }}"}
