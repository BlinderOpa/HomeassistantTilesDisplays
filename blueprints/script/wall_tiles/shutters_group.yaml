blueprint:
  name: "Wall tiles: shutters open / close (group)"
  description: >
    Opens or closes only those shutters of a list that are not already there.
    Close: "down" = position ≤ down_position (default 40 %). Open: every shutter below
    open_position (default 95 %) is opened. When closing, one optional shutter only goes to a partial
    position (e.g. terrace door so the dog can get out).
    Used by the tile "shutters still open / still closed" and the voice confirmations.
  domain: script
  source_url: https://github.com/BlinderOpa/HomeassistantTilesDisplays/blob/main/blueprints/script/wall_tiles/shutters_group.yaml
  input:
    mode:
      name: Mode
      default: close
      selector: {select: {options: [close, open]}}
    covers:
      name: Shutters
      selector: {entity: {domain: cover, multiple: true}}
    partial_cover:
      name: Shutter that only closes partially (optional)
      default: ""
      selector: {entity: {domain: cover}}
    partial_position:
      name: Its position when closing (%)
      default: 40
      selector: {number: {min: 0, max: 100, unit_of_measurement: "%"}}
    down_position:
      name: Counts as down up to position (%)
      default: 40
      selector: {number: {min: 0, max: 100, unit_of_measurement: "%"}}
    open_position:
      name: 'Mode "open": counts as open from position (%)'
      description: >
        In the morning every shutter below this position is opened, so a shutter that was
        set by hand to e.g. 43 % is still treated as "not open yet".
      default: 95
      selector: {number: {min: 1, max: 100, unit_of_measurement: "%"}}

mode: queued

variables:
  mode_: !input mode
  covers_: !input covers
  half: !input partial_cover
  half_pos: !input partial_position
  down_p: !input down_position
  open_p: !input open_position
  todo: >
    {% set ns = namespace(l=[]) %}
    {% for e in covers_ %}
      {% set p = state_attr(e, 'current_position') %}
      {% set is_down = (p is number and p <= down_p | int) or (p is not number and is_state(e, 'closed')) %}
      {% set not_open = (p is number and p < open_p | int) or (p is not number and not is_state(e, 'open')) %}
      {% if (not_open if mode_ == 'open' else not is_down) %}{% set ns.l = ns.l + [e] %}{% endif %}
    {% endfor %}
    {{ ns.l }}
  full: "{{ todo | reject('eq', half) | list if mode_ == 'close' else todo }}"

sequence:
  - if: "{{ mode_ == 'close' and half != '' and half in todo }}"
    then:
      - action: cover.set_cover_position
        target:
          entity_id: "{{ half }}"
        data:
          position: "{{ half_pos | int }}"
  - if: "{{ full | count > 0 }}"
    then:
      - action: "{{ 'cover.close_cover' if mode_ == 'close' else 'cover.open_cover' }}"
        target:
          entity_id: "{{ full }}"
  - variables:
      result:
        moved: "{{ todo | count }}"
        partial: "{{ mode_ == 'close' and half != '' and half in todo }}"
  - stop: done
    response_variable: result
