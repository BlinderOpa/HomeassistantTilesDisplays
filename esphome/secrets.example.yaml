# Copy to esphome/secrets.yaml (git-ignored) and fill in your own values.
wifi_ssid: "your-wifi"
wifi_password: "change-me"

# One API key per device (esphome generate key, or the dashboard).
# Your own device files pass these into the repository files via substitutions
# (api_key, wifi_ssid, wifi_password) – a remote package can't read secrets itself.
wall_display_api_key: "base64-key-1"
voice_satellite_s3_api_key: "base64-key-2"
voice_satellite_c6_api_key: "base64-key-3"
