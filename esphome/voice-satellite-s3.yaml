# ---------------------------------------------------------------
# Anzeige (LVGL)
# ---------------------------------------------------------------
lvgl:
  id: my_lvgl
  log_level: WARN
  bg_color: "0x000000"
  displays:
    - lcd_display

  # Normalansicht
  pages:
    - id: page_0
      layout:
        type: flex
        flex_flow: column
        pad_row: 4
        flex_align_main: center
        flex_align_cross: center
      widgets:
        - container:
            width: 120
            height: 26
            bg_color: "0x111111"
            border_width: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  id: status_label
                  text: !lambda 'return id(status_text).c_str();'
                  text_color: "0x00FF00"
                  text_font: font_text

        - container:
            width: 120
            height: 92
            bg_color: "0x1a1a1a"
            radius: 6
            border_width: 1
            border_color: "0x333333"
            pad_all: 4
            scrollable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              # Passt der Text nicht ins Feld, läuft er langsam nach oben
              # durch und wieder zurück (LVGL long_mode SCROLL)
              - label:
                  id: response_label
                  long_mode: SCROLL
                  max_height: 82
                  text: !lambda |-
                    if (!id(tts_text).empty()) {
                      return id(tts_text).c_str();
                    }
                    // Erst nach der Verbindung zu Home Assistant anzeigen
                    if (id(ha_connected)) {
                      return "Okay Nabu";
                    }
                    return "";
                  text_color: "0xFFFFFF"
                  text_font: font_text
                  width: 110
                  text_align: center
              # Ruheanzeige (sichtbar über Skript idle_view)
              - label:
                  id: clock_label
                  hidden: true
                  text: ""
                  text_color: "0xFFFFFF"
                  text_font: font_clock
                  text_align: center
              - label:
                  id: date_label
                  hidden: true
                  text: ""
                  text_color: "0x9E9E9E"
                  text_font: font_text
                  text_align: center

  # Überlagerungen über der Normalansicht
  top_layer:
    widgets:
      # show_answer: Vollbild in Statusfarbe
      - container:
          id: answer_layer
          hidden: true
          scrollable: false
          x: 0
          y: 0
          width: 128
          height: 128
          radius: 0
          border_width: 0
          pad_all: 4
          bg_color: "0x1E88E5"
          bg_opa: COVER
          layout:
            type: flex
            flex_flow: column
            pad_row: 0
            flex_align_main: center
            flex_align_cross: center
          widgets:
            - label:
                id: answer_icon_label
                text: ""
                text_font: font_icon_big
                text_color: "0xFFFFFF"
            - label:
                id: answer_value_label
                text: ""
                text_font: font_value
                text_color: "0xFFFFFF"
                text_align: center

      # show_question: Icon, Frage, Tastenhinweis
      - container:
          id: question_layer
          hidden: true
          scrollable: false
          x: 0
          y: 0
          width: 128
          height: 128
          radius: 0
          border_width: 0
          pad_all: 4
          bg_color: "0x101010"
          bg_opa: COVER
          layout:
            type: flex
            flex_flow: column
            pad_row: 3
            flex_align_main: space_between
            flex_align_cross: center
          widgets:
            - label:
                id: question_icon_label
                text: ""
                text_font: font_icon_small
                text_color: "0x1E88E5"
            - label:
                id: question_text_label
                text: ""
                text_font: font_small
                text_color: "0xFFFFFF"
                text_align: center
                width: 120
            - container:
                width: 120
                height: 22
                scrollable: false
                border_width: 0
                pad_all: 0
                bg_opa: TRANSP
                layout:
                  type: flex
                  flex_flow: row
                  flex_align_main: space_between
                  flex_align_cross: center
                widgets:
                  - label:
                      text: "- Nein"
                      text_font: font_text
                      text_color: "0xE53935"
                  - label:
                      text: "Ja +"
                      text_font: font_text
                      text_color: "0x43A047"
