      - "\U000F07E4"  # molecule-co2
      - "\U000F0A72"  # solar-power
      - "\U000F042A"  # printer
      - "\U000F0110"  # cart
      - "\U000F05A9"  # wifi
      - "\U000F15B4"  # bicycle-electric
      - "\U000F1402"  # pump
      - "\U000F00ED"  # calendar
