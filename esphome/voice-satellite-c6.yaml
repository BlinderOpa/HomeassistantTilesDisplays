# Part of ha-wall-tiles – https://github.com/BlinderOpa/HomeassistantTilesDisplays (MIT)
# Secrets: copy esphome/secrets.example.yaml to secrets.yaml and fill it in.
# Comments in this file are German (original project language).
# Sprachsatellit C6 - Waveshare ESP32-C6-Touch-LCD-1.83
# Umsetzung der Schnittstelle_Displays.md (v1.4) für den C6:
#   - Aktion show_answer   (title, value, detail, status, icon, duration)
#   - Aktion show_question (request_id, question, icon, timeout) mit Ja/Nein per Touch
#   - Aktion cancel_question (request_id)
#   - Event esphome.display_question_answer (yes | no | timeout | cancelled)
#   - Event esphome.display_ready beim Verbinden mit Home Assistant
#   - Aktion set_tiles (Schnittstelle 4.2, v1.5): Kachel im Ruhezustand, Wischen
#     blättert, ohne Icon. Tippen auf die Kachel sendet esphome.display_tap
#     (wie am 7"-Display; HA entscheidet, was passiert).
#   Nicht für den C6 vorgesehen: Wetter-Grundansicht 4.5 (nur 7"-Display).
#   Aus v1.3 übernommen: die Wetter-Icons, weil Sprachantworten zum Wetter sie
#   schicken können; die übrigen neuen Icons sind Kachel-Icons und fehlen hier
#   (unbekanntes Icon wird zu "information").
# Betriebsart: Push to Assistant (kein Wake Word)
#   - Folgebefehle (Schalter in HA, Standard an): nach einer Antwort hört der Assistent
#     weiter zu ("Rollo hoch", dann "Rollo stop"); Ende bei Stille oder "Abbrechen"
#   - Display-Timeout (Regler in HA, 0 = nie aus): Display geht aus und wacht bei
#     Berührung, BOOT-Taste, Antwort, Frage oder neuem Alarm-Kachel wieder auf
#   - Nur der Knopf "Sprechen" oben oder die BOOT-Taste startet den Sprachassistenten
#   - Solange der Assistent aktiv ist, steht oben der Knopf "Abbrechen"
#   - "Warte auf Befehl..." erscheint nur bei aktivem Assistenten
#   - Unten: im Ruhezustand die aktuelle Kachel, Wischen links/rechts blättert
#   - Lautstärke per Schieberegler in Home Assistant
# Pins gegen Pinout-Grafik und Schaltplan geprüft.
# Nicht eingebunden: SD-Karte (SPI: MOSI=GPIO2, SCK=GPIO1, MISO=GPIO16,
#   CS=GPIO17, gleicher Bus wie das Display) und PMIC AXP2101 (I2C, läuft mit
#   Standardwerten).
# Die Icons (MDI) lädt ESPHome beim Kompilieren aus dem Internet.
# Nicht gegen ESPHome 2026.10 kompiliert.

substitutions:
  # Override these in your own device file (see esphome/examples/), so the
  # device keeps its existing name and entity ids in Home Assistant.
  node_name: voice-satellite-c6
  friendly_name: "Voice Satellite C6"
  # REQUIRED in your device file (secrets can't be read from a remote package):
  #   api_key, wifi_ssid, wifi_password
  #   e.g.  api_key: !secret my_device_api_key

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: lcd_backlight
            brightness: 100%
        - output.turn_on: pa_enable
    - priority: -100
      then:
        - pcf85063.read_time:
        - script.execute: display_wake
        # gespeicherte Lautstärke an den ES8311 übergeben
        - audio_dac.set_volume:
            id: my_es8311
            volume: !lambda 'return id(speaker_volume).state / 100.0f;'

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  on_connect:
    - lambda: 'id(status_text) = "WiFi verbunden...";'
    - lvgl.widget.refresh: status_label

ota:
  - platform: esphome
    encryption:   # nutzt den API-Schlüssel (ESPHome ab 2026.9)

api:
  encryption:
    key: ${api_key}
  on_client_connected:
    - lambda: 'id(status_text) = "Bereit";'
    - script.execute: apply_ui
    # Schnittstelle 4.4: Home Assistant weiß, dass das Gerät (wieder) da ist
    - homeassistant.event:
        event: esphome.display_ready
        data:
          device: ${node_name}
  on_client_disconnected:
    - script.execute: cancel_assistant
    - lambda: 'id(status_text) = "Keine Verbindung";'
    - script.execute: apply_ui
  actions:
    # Schnittstelle 2: einmalige Antwort anzeigen
    # HA: esphome.voice_satellite_c6_show_answer (immer über script.display_answer)
    - action: show_answer
      variables:
        title: string
        value: string
        detail: string
        status: string
        icon: string
        duration: int
      then:
        - script.execute:
            id: show_answer_request
            a_title: !lambda 'return title;'
            a_value: !lambda 'return value;'
            a_detail: !lambda 'return detail;'
            a_status: !lambda 'return status;'
            a_icon: !lambda 'return icon;'
            a_duration: !lambda 'return duration;'

    # Schnittstelle 3: Ja/Nein-Frage anzeigen
    - action: show_question
      variables:
        request_id: string
        question: string
        icon: string
        timeout: int
      then:
        - script.execute:
            id: display_question
            q_id: !lambda 'return request_id;'
            q_text: !lambda 'return question;'
            q_icon: !lambda 'return icon;'
            q_timeout: !lambda 'return timeout;'

    - action: cancel_question
      variables:
        request_id: string
      then:
        - script.execute:
            id: cancel_question_request
            q_id: !lambda 'return request_id;'

    # Schnittstelle 4.2: Kachelliste als JSON-Array (wie beim 7"-Display)
    - action: set_tiles
      variables:
        tiles: string
      then:
        - script.execute:
            id: set_tiles_request
            t_json: !lambda 'return tiles;'

logger:
  level: VERBOSE
  logs:
    wifi: DEBUG         # sonst steht das WLAN-Passwort im Log
    wifi_esp32: DEBUG
    cst816.touchscreen: WARN
    touchscreen: WARN
    qmi8658: WARN
    sensor: WARN
    i2c: WARN
    motion: WARN
    lvgl: WARN
    voice_assistant: DEBUG
    i2s_audio: DEBUG
    es7210: DEBUG

debug:
  update_interval: 30s

globals:
  - id: status_text
    type: std::string
    restore_value: false
    initial_value: '"Bootet..."'

  # Betriebszustand
  - id: assistant_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: answer_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: question_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Text im unteren Bereich (gesprochener Satz oder Frage)
  - id: response_text
    type: std::string
    restore_value: false
    initial_value: '""'

  # aktuelle Antwort (show_answer)
  - id: answer_title
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: answer_value
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: answer_detail
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: answer_status
    type: std::string
    restore_value: false
    initial_value: '"info"'
  - id: answer_icon
    type: std::string
    restore_value: false
    initial_value: '"information"'

  # aktuelle Frage (show_question)
  - id: question_request_id
    type: std::string
    restore_value: false
    initial_value: '""'

  # Kacheln (set_tiles): ein String pro Feld, Einträge getrennt durch 0x1F
  - id: tile_stati
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: tile_titles
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: tile_values
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: tile_details
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: tile_ids
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: tile_taps
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: cur_tile_id
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: cur_tile_tap
    type: std::string
    restore_value: false
    initial_value: '"none"'
  - id: tile_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: tile_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: tile_mode
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: tile_counter_text
    type: std::string
    restore_value: false
    initial_value: '""'
  # Statusfarbe für den Rahmen: alarm | warn | ok | info | on | off | none
  - id: border_status
    type: std::string
    restore_value: false
    initial_value: '"none"'
  # Wischerkennung
  - id: touch_on
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: touch_x0
    type: int
    restore_value: false
    initial_value: '0'
  - id: touch_xl
    type: int
    restore_value: false
    initial_value: '0'
  - id: touch_y0
    type: int
    restore_value: false
    initial_value: '0'
  # Berührung hat das Display geweckt: soll nichts auslösen
  - id: touch_woke
    type: bool
    restore_value: false
    initial_value: 'false'
  # neue Alarm-Kachel eingetroffen (weckt das Display)
  - id: tile_alarm_new
    type: bool
    restore_value: false
    initial_value: 'false'
  # Befehle in dieser Sitzung (für Folgebefehle) und Wächter gegen hängende Anzeige
  - id: session_commands
    type: int
    restore_value: false
    initial_value: '0'
  - id: idle_ticks
    type: int
    restore_value: false
    initial_value: '0'

  # Antwort, die während einer Sprachausgabe eintraf (wird danach angezeigt)
  - id: pending_answer
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pending_title
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pending_value
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pending_detail
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pending_status
    type: std::string
    restore_value: false
    initial_value: '"info"'
  - id: pending_icon
    type: std::string
    restore_value: false
    initial_value: '"information"'
  - id: pending_duration
    type: int
    restore_value: false
    initial_value: '0'

# ----------------------------------------------------------------------------
# I2C Bus (SDA = GPIO 7, SCL = GPIO 8)
# Adressen: ES8311 0x18, ES7210 0x40, QMI8658 0x6B, PCF85063 0x51,
#           CST816D 0x15, AXP2101 0x34
# ----------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 40kHz

# ----------------------------------------------------------------------------
# SPI Bus für das Display (CLK = GPIO 1, MOSI = GPIO 2)
# ----------------------------------------------------------------------------
spi:
  id: spi_bus
  clk_pin: GPIO1
  mosi_pin: GPIO2

# ----------------------------------------------------------------------------
# Ausgänge (Hintergrundbeleuchtung & Audio-Verstärker PA_CTRL auf GPIO 0)
# ----------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO6
    id: backlight_pwm
    frequency: 1000Hz
  - platform: gpio
    pin: GPIO0
    id: pa_enable

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: lcd_backlight
    restore_mode: ALWAYS_ON

# ----------------------------------------------------------------------------
# Display Konfiguration (CS = GPIO 5, DC = GPIO 3, RST = GPIO 4)
# ----------------------------------------------------------------------------
display:
  - platform: ili9xxx
    model: ST7789V
    id: my_display
    spi_id: spi_bus
    cs_pin: GPIO5
    dc_pin: GPIO3
    reset_pin: GPIO4
    rotation: 0
    data_rate: 40MHz
    invert_colors: true
    dimensions:
      width: 240
      height: 284

# ----------------------------------------------------------------------------
# Touchscreen (Interrupt = GPIO 11, Reset = GPIO 4 gemeinsam mit dem Display)
# Kein Start per Berührung mehr (Knopf "Sprechen" oben). Wischen links/rechts
# blättert in der Kachelansicht; erkannt über Start- und Endposition.
# ----------------------------------------------------------------------------
touchscreen:
  platform: cst816
  id: my_touch
  i2c_id: bus_a
  interrupt_pin: GPIO11
  on_update:
    - lambda: |-
        if (touches.empty()) return;
        if (!id(touch_on)) {
          id(touch_on) = true;
          id(touch_x0) = touches[0].x;
          id(touch_y0) = touches[0].y;
          // war das Display aus, weckt die Berührung es nur
          if (!id(lcd_backlight).current_values.is_on()) id(touch_woke) = true;
        }
        id(touch_xl) = touches[0].x;
    - script.execute: display_wake
  on_release:
    - lambda: 'id(touch_on) = false;'
    - script.execute:
        id: tile_swipe
        dx: !lambda 'return id(touch_xl) - id(touch_x0);'
    - delay: 400ms
    - lambda: 'id(touch_woke) = false;'

# ----------------------------------------------------------------------------
# Audio: I2S (MCLK = GPIO 19, SCLK/BCLK = GPIO 20, LRCK = GPIO 22),
# ES8311 DAC (Lautsprecher, DSDIN = GPIO 23) und
# ES7210 ADC (Mikrofon, ASDOUT = GPIO 21)
# ----------------------------------------------------------------------------
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO22
    i2s_bclk_pin: GPIO20
    i2s_mclk_pin: GPIO19

audio_dac:
  - platform: es8311
    id: my_es8311
    address: 0x18
    i2c_id: bus_a

audio_adc:
  - platform: es7210
    id: my_es7210
    address: 0x40
    i2c_id: bus_a
    mic_gain: 24 dB

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO23
    dac_type: external
    audio_dac: my_es8311

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO21
    adc_type: external

# ----------------------------------------------------------------------------
# Echtzeituhr PCF85063 (Interrupt = GPIO 15, wird nicht genutzt)
# ----------------------------------------------------------------------------
time:
  - platform: pcf85063
    id: rtc_time
    i2c_id: bus_a
    update_interval: never
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf85063.write_time:

# ----------------------------------------------------------------------------
# 6-Achsen IMU (QMI8658, Interrupt 1 = GPIO 10, wird nicht genutzt)
# ----------------------------------------------------------------------------
motion:
  - platform: qmi8658
    id: my_qmi8658
    address: 0x6B
    i2c_id: bus_a

sensor:
  - platform: motion
    type: acceleration_x
    name: "Beschleunigung X"
  - platform: motion
    type: acceleration_y
    name: "Beschleunigung Y"
  - platform: motion
    type: acceleration_z
    name: "Beschleunigung Z"
  - platform: motion
    type: gyroscope_x
    name: "Gyroskop X"
  - platform: motion
    type: gyroscope_y
    name: "Gyroskop Y"
  - platform: motion
    type: gyroscope_z
    name: "Gyroskop Z"
  - platform: qmi8658
    type: temperature
    name: "IMU Temperatur"
  # Speicher-Kontrolle (der C6 hat kein PSRAM)
  - platform: debug
    free:
      name: "Freier Heap"
    block:
      name: "Größter freier Block"

# ----------------------------------------------------------------------------
# Tasten
# ----------------------------------------------------------------------------
binary_sensor:
  # BOOT-Taste (GPIO 9): Assistent starten bzw. abbrechen
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode: INPUT_PULLUP
    name: "BOOT Taste"
    on_click:
      - if:
          condition:
            lambda: 'return id(assistant_active);'
          then:
            - script.execute: cancel_assistant
          else:
            - script.execute: start_assistant

  # PWR-Taste (GPIO 18, über SYS_OUT): Polarität im Log prüfen,
  # bei vertauschtem Zustand "inverted: true" setzen
  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT
    name: "PWR Taste"

# ----------------------------------------------------------------------------
# Lautstärke-Regler für den Lautsprecher (in Home Assistant als Schieberegler);
# wirkt über den ES8311 auf alle Ausgaben des Assistenten
# ----------------------------------------------------------------------------
number:
  - platform: template
    name: "Lautstärke"
    id: speaker_volume
    icon: "mdi:volume-high"
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 50
    set_action:
      - audio_dac.set_volume:
          id: my_es8311
          volume: !lambda 'return x / 100.0f;'

  # Nach so vielen Sekunden ohne Aktivität geht das Display aus (0 = nie)
  - platform: template
    name: "Display-Timeout"
    id: display_timeout
    icon: "mdi:monitor-off"
    unit_of_measurement: "s"
    mode: box
    min_value: 0
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 60
    set_action:
      - script.execute: display_wake

# Nach einer Antwort weiter zuhören (Folgebefehle wie "Rollo stop")
switch:
  - platform: template
    name: "Folgebefehle"
    id: follow_up
    icon: "mdi:message-reply-text"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# ----------------------------------------------------------------------------
# Skripte
# ----------------------------------------------------------------------------
script:
  # Display einschalten (falls aus) und Abschaltzeit neu starten
  - id: display_wake
    then:
      - if:
          condition:
            lambda: 'return !id(lcd_backlight).current_values.is_on();'
          then:
            - light.turn_on:
                id: lcd_backlight
                transition_length: 200ms
      - script.execute: display_sleep

  # Abschaltzeit: nach dem Timeout aus, solange Assistent, Antwort oder Frage laufen, nicht
  - id: display_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(display_timeout).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t) (id(display_timeout).state * 1000);'
            - while:
                condition:
                  lambda: 'return id(assistant_active) || id(answer_active) || id(question_active);'
                then:
                  - delay: 1s
            - delay: 10s
            - if:
                condition:
                  lambda: 'return !id(assistant_active) && !id(answer_active) && !id(question_active);'
                then:
                  - light.turn_off:
                      id: lcd_backlight
                      transition_length: 400ms

  # Assistent starten (Berührung oder BOOT-Taste)
  - id: start_assistant
    mode: single
    then:
      - script.execute: display_wake
      - if:
          condition:
            api.connected:
          then:
            - if:
                condition:
                  and:
                    - not:
                        voice_assistant.is_running:
                    - not:
                        speaker.is_playing: board_speaker
                then:
                  - script.execute: abort_question
                  - script.stop: answer_timer
                  - script.stop: question_timer
                  - script.stop: auto_clear
                  - script.execute: clear_response
                  - lambda: |-
                      id(assistant_active) = true;
                      id(session_commands) = 0;
                      id(status_text) = "Höre zu...";
                  - script.execute: apply_response
                  - script.execute: session_watchdog
                  # mit Folgebefehlen hört der Assistent nach jeder Antwort weiter zu
                  - if:
                      condition:
                        switch.is_on: follow_up
                      then:
                        - voice_assistant.start_continuous:
                      else:
                        - voice_assistant.start:
          else:
            - lambda: 'id(status_text) = "Keine Verbindung";'
            - script.execute: apply_ui

  # Assistent und Sprachausgabe beenden (Knopf "Abbrechen")
  - id: cancel_assistant
    then:
      - script.execute: abort_question
      - voice_assistant.stop:
      - speaker.stop: board_speaker
      - script.stop: answer_timer
      - script.stop: question_timer
      - script.execute: clear_response
      - lambda: |-
          id(assistant_active) = false;
          id(status_text) = "Bereit";
      - script.execute: apply_response

  # Wächter: steht die Anzeige auf "aktiv", der Assistent läuft aber nicht mehr
  # und es wird nichts abgespielt, nach 3 s zurück auf "Bereit"
  - id: session_watchdog
    mode: restart
    then:
      - lambda: 'id(idle_ticks) = 0;'
      - delay: 5s
      - while:
          condition:
            lambda: 'return id(assistant_active);'
          then:
            - delay: 1s
            - if:
                condition:
                  and:
                    - not:
                        voice_assistant.is_running:
                    - not:
                        speaker.is_playing: board_speaker
                then:
                  - lambda: 'id(idle_ticks)++;'
                else:
                  - lambda: 'id(idle_ticks) = 0;'
            - if:
                condition:
                  lambda: 'return id(idle_ticks) >= 3;'
                then:
                  - lambda: |-
                      id(assistant_active) = false;
                      id(status_text) = "Bereit";
                      id(idle_ticks) = 0;
                  - script.execute: apply_response

  # Status, Hinweistext und Abbrechen-Knopf aktualisieren
  - id: apply_ui
    then:
      - lvgl.widget.refresh: status_label
      - lvgl.widget.refresh: response_label
      - if:
          condition:
            lambda: 'return id(assistant_active);'
          then:
            - lvgl.widget.show: cancel_button
          else:
            - lvgl.widget.hide: cancel_button
      - if:
          condition:
            lambda: 'return !id(assistant_active) && !id(question_active);'
          then:
            - lvgl.widget.show: start_button
          else:
            - lvgl.widget.hide: start_button

  # ---------------------------------------------------------------- Antwort
  # Eintreffende Antwort: während Assistent oder Sprachausgabe läuft, merken
  # und danach anzeigen (Schnittstelle 2, Regel für Satelliten)
  - id: show_answer_request
    mode: restart
    parameters:
      a_title: string
      a_value: string
      a_detail: string
      a_status: string
      a_icon: string
      a_duration: int
    then:
      - script.execute: display_wake
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              - speaker.is_playing: board_speaker
          then:
            - lambda: |-
                id(pending_title) = a_title;
                id(pending_value) = a_value;
                id(pending_detail) = a_detail;
                id(pending_status) = a_status;
                id(pending_icon) = a_icon;
                id(pending_duration) = a_duration;
                id(pending_answer) = true;
          else:
            - script.execute:
                id: display_answer
                d_title: !lambda 'return a_title;'
                d_value: !lambda 'return a_value;'
                d_detail: !lambda 'return a_detail;'
                d_status: !lambda 'return a_status;'
                d_icon: !lambda 'return a_icon;'
                d_duration: !lambda 'return a_duration;'

  # gemerkte Antwort nach dem Ende der Sprachausgabe anzeigen
  - id: show_pending
    then:
      - lambda: 'id(pending_answer) = false;'
      - script.execute:
          id: display_answer
          d_title: !lambda 'return id(pending_title);'
          d_value: !lambda 'return id(pending_value);'
          d_detail: !lambda 'return id(pending_detail);'
          d_status: !lambda 'return id(pending_status);'
          d_icon: !lambda 'return id(pending_icon);'
          d_duration: !lambda 'return id(pending_duration);'

  - id: display_answer
    mode: single
    parameters:
      d_title: string
      d_value: string
      d_detail: string
      d_status: string
      d_icon: string
      d_duration: int
    then:
      - script.execute: abort_question
      - script.execute:
          id: set_icon
          i_name: !lambda 'return d_icon;'
      - lambda: |-
          // unbekannter Status wird wie "info" behandelt
          std::string s = d_status;
          if (s != "alarm" && s != "warn" && s != "ok" && s != "info" && s != "on" && s != "off") s = "info";
          id(answer_status) = s;
          id(answer_title) = d_title;
          id(answer_value) = d_value;
          id(answer_detail) = d_detail;
          id(answer_active) = true;
          id(question_active) = false;
      - script.execute: apply_response
      - script.execute:
          id: answer_timer
          t_seconds: !lambda 'return d_duration > 0 ? d_duration : 8;'

  # nach der Anzeigedauer zurück in den Normalzustand
  - id: answer_timer
    mode: restart
    parameters:
      t_seconds: int
    then:
      - delay: !lambda 'return t_seconds * 1000;'
      - script.execute: clear_response

  # unbekannte Icon-Namen werden zu "information"
  - id: set_icon
    parameters:
      i_name: string
    then:
      - lambda: |-
          static const char *const known[] = {
            "check", "close", "alert", "information", "help",
            "trash-can", "train", "washing-machine", "thermometer", "water-alert",
            "battery-alert", "power-plug", "pool", "door-open", "molecule-co2",
            "solar-power", "printer", "cart", "wifi", "bicycle-electric", "pump",
            "calendar", "lightbulb", "fire",
            "weather-sunny", "weather-night", "weather-partly-cloudy", "weather-cloudy", "weather-rainy", "weather-pouring", "weather-snowy", "weather-snowy-rainy", "weather-fog", "weather-hail", "weather-lightning", "weather-lightning-rainy", "weather-windy"};
          std::string n = i_name;
          bool found = false;
          for (auto k : known) {
            if (n == k) found = true;
          }
          id(answer_icon) = found ? n : std::string("information");

  # ---------------------------------------------------------------- Frage
  - id: display_question
    mode: single
    parameters:
      q_id: string
      q_text: string
      q_icon: string
      q_timeout: int
    then:
      - script.execute: display_wake
      - script.execute: abort_question
      - script.execute:
          id: set_icon
          i_name: !lambda 'return q_icon;'
      - lambda: |-
          id(question_request_id) = q_id;
          id(response_text) = q_text;
          id(answer_active) = false;
          id(question_active) = true;
      - script.execute: apply_response
      - script.execute:
          id: question_timer
          t_seconds: !lambda 'return q_timeout > 0 ? q_timeout : 30;'

  - id: question_timer
    mode: restart
    parameters:
      t_seconds: int
    then:
      - delay: !lambda 'return t_seconds * 1000;'
      - script.execute:
          id: answer_question
          antwort: "timeout"

  # genau ein Event pro Frage (yes | no | timeout | cancelled)
  - id: answer_question
    mode: single
    parameters:
      antwort: string
    then:
      - if:
          condition:
            lambda: 'return id(question_active);'
          then:
            - lambda: 'id(question_active) = false;'
            - script.stop: question_timer
            - homeassistant.event:
                event: esphome.display_question_answer
                data:
                  device: ${node_name}
                data_template:
                  request_id: "{{ req }}"
                  answer: "{{ ans }}"
                variables:
                  req: !lambda 'return id(question_request_id);'
                  ans: !lambda 'return antwort;'
            - script.execute: clear_response

  # offene Frage verwerfen (z. B. neue Antwort, neue Frage, Assistent gestartet)
  - id: abort_question
    then:
      - if:
          condition:
            lambda: 'return id(question_active);'
          then:
            - script.execute:
                id: answer_question
                antwort: "cancelled"

  # cancel_question aus Home Assistant
  - id: cancel_question_request
    parameters:
      q_id: string
    then:
      - if:
          condition:
            lambda: 'return id(question_active) && id(question_request_id) == q_id;'
          then:
            - script.execute:
                id: answer_question
                antwort: "cancelled"

  # ---------------------------------------------------------------- Anzeige
  # Welche Teile im unteren Bereich sichtbar sind
  - id: apply_response
    then:
      - lambda: |-
          // Kachelansicht nur im Ruhezustand und wenn Kacheln vorhanden sind
          id(tile_mode) = !id(answer_active) && !id(question_active) &&
                          id(response_text).empty() && !id(assistant_active) &&
                          id(tile_count) > 0;
          if (id(tile_mode)) {
            auto nth = [](const std::string &s, int k) -> std::string {
              size_t a = 0;
              for (int j = 0; j < k; j++) {
                a = s.find('\x1f', a);
                if (a == std::string::npos) return "";
                a++;
              }
              size_t b = s.find('\x1f', a);
              return s.substr(a, b == std::string::npos ? std::string::npos : b - a);
            };
            int k = id(tile_idx);
            if (k < 0 || k >= id(tile_count)) { k = 0; id(tile_idx) = 0; }
            id(answer_title) = nth(id(tile_titles), k);
            id(answer_value) = nth(id(tile_values), k);
            id(answer_detail) = nth(id(tile_details), k);
            id(border_status) = nth(id(tile_stati), k);
            id(cur_tile_id) = nth(id(tile_ids), k);
            id(cur_tile_tap) = nth(id(tile_taps), k);
            if (id(cur_tile_tap).empty()) id(cur_tile_tap) = "none";
            char buf[16];
            snprintf(buf, sizeof(buf), "< %d / %d >", k + 1, id(tile_count));
            id(tile_counter_text) = buf;
          } else if (id(answer_active)) {
            id(border_status) = id(answer_status);
            id(cur_tile_tap) = "none";
          } else {
            id(border_status) = "none";
            id(cur_tile_tap) = "none";
          }
      - lvgl.widget.refresh: answer_title_label
      - lvgl.widget.refresh: answer_value_label
      - lvgl.widget.refresh: answer_detail_label
      - lvgl.widget.refresh: response_label
      - lvgl.widget.refresh: tile_count_label
      - if:
          condition:
            lambda: 'return id(tile_mode);'
          then:
            - lvgl.widget.hide: icon_slot
            - lvgl.widget.show: answer_title_label
            - lvgl.widget.show: answer_value_label
            - if:
                condition:
                  lambda: 'return !id(answer_detail).empty();'
                then:
                  - lvgl.widget.show: answer_detail_label
                else:
                  - lvgl.widget.hide: answer_detail_label
            - lvgl.widget.hide: response_label
            - lvgl.widget.hide: question_row
            - if:
                condition:
                  lambda: 'return id(tile_count) > 1;'
                then:
                  - lvgl.widget.show: tile_count_label
                else:
                  - lvgl.widget.hide: tile_count_label
          else:
            - lvgl.widget.hide: tile_count_label
            - if:
                condition:
                  lambda: 'return id(answer_active);'
                then:
                  - lvgl.widget.show: icon_slot
                  - lvgl.widget.show: answer_title_label
                  - lvgl.widget.show: answer_value_label
                  - if:
                      condition:
                        lambda: 'return !id(answer_detail).empty();'
                      then:
                        - lvgl.widget.show: answer_detail_label
                      else:
                        - lvgl.widget.hide: answer_detail_label
                  - lvgl.widget.hide: response_label
                  - lvgl.widget.hide: question_row
                else:
                  - lvgl.widget.hide: answer_title_label
                  - lvgl.widget.hide: answer_value_label
                  - lvgl.widget.hide: answer_detail_label
                  - lvgl.widget.show: response_label
                  - if:
                      condition:
                        lambda: 'return id(question_active);'
                      then:
                        - lvgl.widget.show: icon_slot
                        - lvgl.widget.show: question_row
                      else:
                        - lvgl.widget.hide: icon_slot
                        - lvgl.widget.hide: question_row
      - script.execute: apply_border
      - script.execute: apply_icon
      - script.execute: apply_ui

  # Kachelliste empfangen (Schnittstelle 4.2): JSON-Array, hier ohne JSON-Bibliothek
  # eingelesen; bis zu 12 Einträge, Felder status, title, value, detail
  - id: set_tiles_request
    mode: restart
    parameters:
      t_json: string
    then:
      - lambda: |-
          const std::string &s = t_json;
          const size_t n = s.size();
          // Zeichen, die die Schrift nicht hat, durch Ersatz austauschen
          auto sanitize = [](const std::string &in) -> std::string {
            std::string out;
            size_t p = 0;
            while (p < in.size()) {
              unsigned char c = in[p];
              unsigned cp = 0;
              size_t len = 1;
              if (c < 0x80) { cp = c; len = 1; }
              else if ((c >> 5) == 6) { cp = c & 0x1F; len = 2; }
              else if ((c >> 4) == 14) { cp = c & 0x0F; len = 3; }
              else if ((c >> 3) == 30) { cp = c & 0x07; len = 4; }
              else { out += '?'; p++; continue; }
              for (size_t q = 1; q < len && p + q < in.size(); q++) cp = (cp << 6) | (in[p + q] & 0x3F);
              bool ok = (cp >= 0x20 && cp < 0x7F) || (cp >= 0xA0 && cp <= 0xFF) ||
                        cp == 0x3BC || cp == 0x3A9 || cp == 0x20AC || cp == 0x2122;
              if (ok) out += in.substr(p, len);
              else if (cp == 0x2192 || cp == 0x2013 || cp == 0x2014) out += '-';
              else if (cp == 0x2082) out += '2';
              else if (cp == 0x201C || cp == 0x201D || cp == 0x201E) out += '"';
              else if (cp == 0x2018 || cp == 0x2019) out += '\'';
              else if (cp == 0x2026) out += "...";
              else if (cp < 0x20) out += ' ';
              else out += '?';
              p += len;
            }
            return out;
          };
          // String ab der öffnenden Anführungszeichen-Position lesen (\", \\, \uXXXX)
          auto parse_str = [&](size_t &p) -> std::string {
            std::string out;
            p++;
            while (p < n && s[p] != '"') {
              char c = s[p];
              if (c == '\\' && p + 1 < n) {
                char e = s[p + 1];
                p += 2;
                if (e == 'u' && p + 4 <= n) {
                  unsigned cp = strtoul(s.substr(p, 4).c_str(), nullptr, 16);
                  p += 4;
                  if (cp < 0x80) out += (char) cp;
                  else if (cp < 0x800) {
                    out += (char) (0xC0 | (cp >> 6));
                    out += (char) (0x80 | (cp & 0x3F));
                  } else {
                    out += (char) (0xE0 | (cp >> 12));
                    out += (char) (0x80 | ((cp >> 6) & 0x3F));
                    out += (char) (0x80 | (cp & 0x3F));
                  }
                } else if (e == 'n' || e == 't') {
                  out += ' ';
                } else {
                  out += e;
                }
              } else {
                out += c;
                p++;
              }
            }
            p++;
            return out;
          };
          std::string st, ti, va, de, ki, tp;
          int count = 0;
          size_t i = 0;
          while (i < n && count < 12) {
            size_t o = s.find('{', i);
            if (o == std::string::npos) break;
            i = o + 1;
            std::string status = "info", title, value, detail, kid, tap = "none";
            while (i < n && s[i] != '}') {
              if (s[i] == '"') {
                std::string key = parse_str(i);
                while (i < n && (s[i] == ' ' || s[i] == ':')) i++;
                if (i < n && s[i] == '"') {
                  std::string v = parse_str(i);
                  if (key == "status") status = v;
                  else if (key == "title") title = sanitize(v);
                  else if (key == "value") value = sanitize(v);
                  else if (key == "detail") detail = sanitize(v);
                  else if (key == "id") kid = v;
                  else if (key == "tap") tap = v;
                } else {
                  while (i < n && s[i] != ',' && s[i] != '}') i++;
                }
              } else {
                i++;
              }
            }
            i++;
            if (status != "alarm" && status != "warn" && status != "ok" &&
                status != "info" && status != "on" && status != "off") status = "info";
            if (count > 0) { st += '\x1f'; ti += '\x1f'; va += '\x1f'; de += '\x1f'; ki += '\x1f'; tp += '\x1f'; }
            st += status; ti += title; va += value; de += detail; ki += kid; tp += tap;
            count++;
          }
          // neue Alarm-Kachel: weckt das Display
          id(tile_alarm_new) = (st.find("alarm") != std::string::npos) &&
                               (st != id(tile_stati) || ti != id(tile_titles) || va != id(tile_values));
          id(tile_stati) = st;
          id(tile_titles) = ti;
          id(tile_values) = va;
          id(tile_details) = de;
          id(tile_ids) = ki;
          id(tile_taps) = tp;
          id(tile_count) = count;
          if (id(tile_idx) >= count) id(tile_idx) = 0;
      - if:
          condition:
            lambda: 'return id(tile_alarm_new);'
          then:
            - script.execute: display_wake
      - script.execute: apply_response

  # Berührung losgelassen: Wischen blättert, kurzes Tippen auf die Kachel (unterhalb
  # der Kopfleiste) sendet esphome.display_tap, sofern die Kachel ein tap hat
  - id: tile_swipe
    parameters:
      dx: int
    then:
      - if:
          condition:
            lambda: 'return id(tile_mode) && !id(touch_woke) && id(tile_count) > 1 && (dx > 40 || dx < -40);'
          then:
            - lambda: |-
                int n = id(tile_count);
                if (dx < 0) id(tile_idx) = (id(tile_idx) + 1) % n;
                else id(tile_idx) = (id(tile_idx) + n - 1) % n;
            - script.execute: apply_response
      - if:
          condition:
            lambda: |-
              return id(tile_mode) && !id(touch_woke) && dx > -15 && dx < 15 && id(touch_y0) > 55 &&
                     id(cur_tile_tap) != "none" && !id(cur_tile_id).empty();
          then:
            # kurzes Aufblitzen als Rückmeldung
            - lvgl.widget.update:
                id: answer_box
                bg_color: "0x444444"
            - homeassistant.event:
                event: esphome.display_tap
                data:
                  device: ${node_name}
                data_template:
                  id: "{{ kid }}"
                  tap: "{{ ktap }}"
                variables:
                  kid: !lambda 'return id(cur_tile_id);'
                  ktap: !lambda 'return id(cur_tile_tap);'
            - delay: 150ms
            - lvgl.widget.update:
                id: answer_box
                bg_color: "0x1a1a1a"

