# ----------------------------------------------------------------------------
# LVGL Benutzeroberfläche (240 x 284)
# ----------------------------------------------------------------------------
lvgl:
  id: my_lvgl
  log_level: WARN
  buffer_size: 25%  # kein PSRAM: kleinerer Zeichenpuffer spart internen Speicher
  bg_color: "0x000000"
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touch
  pages:
    - id: page_0
      layout:
        type: flex
        flex_flow: column
        pad_row: 10
        pad_column: 10
        flex_align_main: center
        flex_align_cross: center

      widgets:
        # Oberer Bereich: Status, bei aktivem Assistenten zusätzlich "Abbrechen"
        - container:
            margin_left: 10
            width: 220
            height: 40
            bg_color: "0x111111"
            border_width: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - label:
                  id: status_label
                  text: !lambda 'return id(status_text).c_str();'
                  text_color: "0x00FF00"
                  text_font: font_roboto_400_14
              - button:
                  id: start_button
                  width: 100
                  height: 32
                  radius: 6
                  bg_color: "0x2E7D32"
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(touch_woke);'
                        then:
                          - script.execute: start_assistant
                  widgets:
                    - label:
                        align: CENTER
                        text: "Sprechen"
                        text_color: "0xFFFFFF"
                        text_font: font_roboto_400_14
              - button:
                  id: cancel_button
                  hidden: true
                  width: 100
                  height: 32
                  radius: 6
                  bg_color: "0xB71C1C"
                  on_click:
                    - script.execute: cancel_assistant
                  widgets:
                    - label:
                        align: CENTER
                        text: "Abbrechen"
                        text_color: "0xFFFFFF"
                        text_font: font_roboto_400_14

        # Unterer Bereich: Antwort (Icon, Titel, Wert, Detail), gesprochener
        # Satz bzw. Frage mit Ja/Nein
        - container:
            id: answer_box
            scrollable: false
            margin_left: 10
            width: 220
            height: 210
            bg_color: "0x1a1a1a"
            radius: 8
            border_width: 1
            border_color: "0x333333"
            layout:
              type: flex
              flex_flow: column
              pad_row: 4
              flex_align_main: center
              flex_align_cross: center
            widgets:
              # Icon in Statusfarbe: ein Kreis pro Status, nur einer sichtbar
              - container:
                  id: icon_slot
                  hidden: true
                  scrollable: false
                  width: 64
                  height: 64
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - container:
                        id: circle_alarm
                        hidden: true
                        scrollable: false
                        align: CENTER
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: "0xE53935"
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - container:
                        id: circle_warn
                        hidden: true
                        scrollable: false
                        align: CENTER
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: "0xFB8C00"
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - container:
                        id: circle_ok
                        hidden: true
                        scrollable: false
                        align: CENTER
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: "0x43A047"
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - container:
                        id: circle_info
                        hidden: true
                        scrollable: false
                        align: CENTER
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: "0x1E88E5"
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - container:
                        id: circle_on
                        hidden: true
                        scrollable: false
                        align: CENTER
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: "0xFDD835"
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - container:
                        id: circle_off
                        hidden: true
                        scrollable: false
                        align: CENTER
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: "0x616161"
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - image:
                        id: answer_img
                        src: img_information
                        align: CENTER
                        image_recolor: "0xFFFFFF"
                        image_recolor_opa: COVER

              - label:
                  id: answer_title_label
                  hidden: true
                  text: !lambda 'return id(answer_title).c_str();'
                  text_color: "0xAAAAAA"
                  text_font: font_roboto_400_14
                  width: 200
                  text_align: center
              - label:
                  id: answer_value_label
                  hidden: true
                  text: !lambda 'return id(answer_value).c_str();'
                  text_color: "0xFFFFFF"
                  text_font: font_roboto_400_28
                  width: 200
                  text_align: center
              - label:
                  id: answer_detail_label
                  hidden: true
                  text: !lambda 'return id(answer_detail).c_str();'
                  text_color: "0xCCCCCC"
                  text_font: font_roboto_400_14
                  width: 200
                  text_align: center
              - label:
                  id: tile_count_label
                  hidden: true
                  text: !lambda 'return id(tile_counter_text).c_str();'
                  text_color: "0x888888"
                  text_font: font_roboto_400_14

              - label:
                  id: response_label
                  text: !lambda |-
                    if (!id(response_text).empty()) {
                      return id(response_text).c_str();
                    }
                    if (id(assistant_active)) {
                      return "Warte auf Befehl...";
                    }
                    return "Keine Meldungen";
                  text_color: "0xFFFFFF"
                  text_font: font_roboto_400_20
                  width: 200
                  text_align: center

              # Ja/Nein-Tasten, nur bei einer Frage sichtbar
              - container:
                  id: question_row
                  hidden: true
                  scrollable: false
                  width: 200
                  height: 48
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_evenly
                    flex_align_cross: center
                  widgets:
                    - button:
                        id: answer_yes
                        width: 84
                        height: 42
                        radius: 8
                        bg_color: "0x43A047"
                        on_click:
                          - script.execute:
                              id: answer_question
                              antwort: "yes"
                        widgets:
                          - label:
                              align: CENTER
                              text: "Ja"
                              text_color: "0xFFFFFF"
                              text_font: font_roboto_400_20
                    - button:
                        id: answer_no
                        width: 84
                        height: 42
                        radius: 8
                        bg_color: "0xE53935"
                        on_click:
                          - script.execute:
                              id: answer_question
                              antwort: "no"
                        widgets:
                          - label:
                              align: CENTER
                              text: "Nein"
                              text_color: "0xFFFFFF"
                              text_font: font_roboto_400_20
