                src: img_weather_partly_cloudy
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-cloudy";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_cloudy
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-rainy";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_rainy
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-pouring";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_pouring
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-snowy";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_snowy
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-snowy-rainy";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_snowy_rainy
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-fog";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_fog
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-hail";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_hail
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-lightning";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_lightning
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-lightning-rainy";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_lightning_rainy
      - if:
          condition:
            lambda: 'return id(answer_icon) == "weather-windy";'
          then:
            - lvgl.image.update:
                id: answer_img
                src: img_weather_windy

  - id: clear_response
    then:
      - lambda: |-
          id(response_text) = "";
          id(answer_active) = false;
          id(question_active) = false;
      - script.execute: apply_response

  # Gesprochenen Satz nach 20 Sekunden ausblenden
  - id: auto_clear
    mode: restart
    then:
      - delay: 20s
      - if:
          condition:
            lambda: 'return !id(answer_active) && !id(question_active);'
          then:
            - script.execute: clear_response

# ----------------------------------------------------------------------------
# Sprachassistent (ohne Wake Word, wird per Berührung gestartet)
# ----------------------------------------------------------------------------
voice_assistant:
  id: my_voice_assistant
  speaker: board_speaker
  microphone:
    - microphone: board_mic
  auto_gain: 21dBFS
  on_listening:
    - lambda: |-
        id(status_text) = "Höre zu...";
        id(assistant_active) = true;
    - script.execute: display_wake
    - script.execute: session_watchdog
    - script.execute: apply_response
  on_stt_end:
    - lambda: 'if (!x.empty()) id(session_commands)++;'
  on_stt_vad_end:
    - lambda: 'id(status_text) = "Verstehe...";'
    - lvgl.widget.refresh: status_label
  # Antwort liegt vor: ohne eigene Anzeige den gesprochenen Satz anzeigen
  on_tts_start:
    - lambda: |-
        id(status_text) = "Spreche...";
        if (!id(answer_active) && !id(question_active)) {
          id(response_text) = x;
        }
    - script.execute: apply_response
    - lvgl.widget.refresh: status_label
  # Alles fertig: gemerkte Antwort anzeigen, sonst Satz nach 20 s ausblenden
  on_idle:
    - lambda: |-
        id(assistant_active) = false;
        id(status_text) = "Bereit";
    - script.execute: apply_response
    - if:
        condition:
          lambda: 'return id(pending_answer);'
        then:
          - script.execute: show_pending
        else:
          - script.execute: auto_clear
  on_error:
    - if:
        # Stille nach einem erfolgreichen Befehl (Folgebefehle): leise beenden
        condition:
          lambda: 'return code == "stt-no-text-recognized" && id(session_commands) > 0;'
        then:
          - voice_assistant.stop:
          - lambda: |-
              id(assistant_active) = false;
              id(status_text) = "Bereit";
          - script.execute: apply_response
        else:
          - script.execute:
              id: display_answer
              d_title: "Assistent"
              d_value: !lambda 'return code == "stt-no-text-recognized" ? std::string("Nicht verstanden") : std::string("Fehler");'
              d_detail: ""
              d_status: "alarm"
              d_icon: "close"
              d_duration: 3
          - lambda: 'id(status_text) = "Fehler";'
          - lvgl.widget.refresh: status_label
          - delay: 3s
          - lambda: |-
              id(assistant_active) = false;
              id(status_text) = "Bereit";
          - script.execute: apply_response

