                border_width: 4
      - if:
          condition:
            lambda: 'return id(border_status) == "on";'
          then:
            - lvgl.widget.update:
                id: answer_box
                border_color: "0xFDD835"
                border_width: 4
      - if:
          condition:
            lambda: 'return id(border_status) == "off";'
          then:
            - lvgl.widget.update:
                id: answer_box
                border_color: "0x616161"
                border_width: 4

