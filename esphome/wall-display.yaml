# ============================================================================
# Zustand und Hilfsfunktionen
# ============================================================================

globals:
  - id: night_awake        # Nachtmodus: gerade per Tipp/Popup geweckt
    type: bool
    initial_value: 'false'
  - id: alarm_active       # mindestens eine Kachel mit status alarm
    type: bool
    initial_value: 'false'
  - id: backlight_is_on    # tatsächlicher Zustand der Beleuchtung
    type: bool
    initial_value: 'true'
  - id: boot_done
    type: bool
    initial_value: 'false'
  - id: tile_ids
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(12)'
  - id: tile_taps
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(12, "none")'
  - id: q_request_id
    type: std::string
    initial_value: '""'
  - id: q_active
    type: bool
    initial_value: 'false'
  # 1.1 Status -> Farbe (unbekannt -> info)
  - id: status_color
    type: std::function<uint32_t(const std::string &)>
    initial_value: |-
      [](const std::string &s) -> uint32_t {
        if (s == "alarm") return 0xE53935;
        if (s == "warn")  return 0xFB8C00;
        if (s == "ok")    return 0x43A047;
        if (s == "on")    return 0xFDD835;
        if (s == "off")   return 0x616161;
        return 0x1E88E5;
      }
  # 1.2 Icon-Name (ohne "mdi:") -> Glyphe (unbekannt -> information)
  - id: icon_glyph
    type: std::function<std::string(const std::string &)>
    initial_value: |-
      [](const std::string &name) -> std::string {
        static const std::map<std::string, std::string> m = {
          {"check", "\U000F012C"},
          {"close", "\U000F0156"},
          {"alert", "\U000F0026"},
          {"information", "\U000F02FC"},
          {"help", "\U000F02D6"},
          {"trash-can", "\U000F0A79"},
          {"train", "\U000F052C"},
          {"washing-machine", "\U000F072A"},
          {"thermometer", "\U000F050F"},
          {"water-alert", "\U000F1502"},
          {"battery-alert", "\U000F0083"},
          {"power-plug", "\U000F06A5"},
          {"pool", "\U000F0606"},
          {"door-open", "\U000F081C"},
          {"molecule-co2", "\U000F07E4"},
          {"solar-power", "\U000F0A72"},
          {"printer", "\U000F042A"},
          {"cart", "\U000F0110"},
          {"wifi", "\U000F05A9"},
          {"bicycle-electric", "\U000F15B4"},
          {"pump", "\U000F1402"},
          {"calendar", "\U000F00ED"},
          {"lightbulb", "\U000F0335"},
          {"fire", "\U000F0238"},
          {"printer-3d", "\U000F042B"},
          {"printer-3d-nozzle-alert", "\U000F11C0"},
          {"heat-pump", "\U000F1A43"},
          {"fan-alert", "\U000F146C"},
          {"window-shutter", "\U000F111C"},
          {"window-shutter-open", "\U000F111E"},
          {"weather-sunny", "\U000F0599"},
          {"weather-night", "\U000F0594"},
          {"weather-partly-cloudy", "\U000F0595"},
          {"weather-cloudy", "\U000F0590"},
          {"weather-rainy", "\U000F0597"},
          {"weather-pouring", "\U000F0596"},
          {"weather-snowy", "\U000F0598"},
          {"weather-snowy-rainy", "\U000F067F"},
          {"weather-fog", "\U000F0591"},
          {"weather-hail", "\U000F0592"},
          {"weather-lightning", "\U000F0593"},
          {"weather-lightning-rainy", "\U000F067E"},
          {"weather-windy", "\U000F059D"},
          {"flash", "\U000F0241"},
          {"thermometer-alert", "\U000F0E01"},
          {"thermometer-high", "\U000F10C2"},
          {"washing-machine-alert", "\U000F11BC"},
          {"water-percent-alert", "\U000F1509"},
          {"water-thermometer", "\U000F1A85"},
          {"wrench", "\U000F05B7"},
          {"phone-ring", "\U000F11AB"},
          {"phone-missed", "\U000F03FA"},
          {"snowflake-alert", "\U000F0F29"},
          {"weather-snowy-heavy", "\U000F0F36"},
          {"trash-can-outline", "\U000F0A7A"},
          // v1.14
          {"clock-outline", "\U000F0150"},
          {"timer-outline", "\U000F051B"},
          {"fan", "\U000F0210"},
          {"alarm", "\U000F0020"},
          {"alarm-off", "\U000F0023"},
          {"battery-charging", "\U000F0084"},
          {"progress-clock", "\U000F0996"},
          {"school", "\U000F0474"}
        };
        std::string k = name;
        if (k.rfind("mdi:", 0) == 0) k = k.substr(4);
        auto it = m.find(k);
        return it != m.end() ? it->second : m.at("information");
      }
  # Zahl mit deutschem Komma; NaN -> "--"
  - id: fmt_num
    type: std::function<std::string(float, int)>
    initial_value: |-
      [](float v, int dec) -> std::string {
        if (isnan(v)) return std::string("--");
        std::string s = str_sprintf(dec == 0 ? "%.0f" : "%.1f", v);
        if (s == "-0" || s == "-0.0") s = s.substr(1);
        for (auto &ch : s) if (ch == '.') ch = ',';
        return s;
      }
  # Gültige Zeit: HA bevorzugt, sonst SNTP
  - id: now_time
    type: std::function<esphome::ESPTime()>
    initial_value: |-
      []() -> esphome::ESPTime {
        auto t = id(ha_time).now();
        if (!t.is_valid()) t = id(sntp_time).now();
        return t;
      }

script:
  # Beleuchtung an, wenn: Schalter an UND (kein Nachtmodus ODER geweckt ODER Alarm)
  - id: apply_backlight
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(boot_done);'
          then:
            - lambda: |-
                bool want = id(display_backlight).state &&
                            (!id(night_mode).state || id(night_awake) || id(alarm_active));
                id(ch422g_hub)->digital_write(2, want);
                id(backlight_is_on) = want;
            - if:
                condition:
                  lambda: 'return id(backlight_is_on);'
                then:
                  - lvgl.resume:
                  - lvgl.widget.redraw:
                else:
                  # beim Ausgehen zurück zur Grundansicht, damit nach dem Wecken die Uhr kommt
                  - lvgl.widget.hide: tiles_view
                  - lvgl.pause:

  # Nachtmodus: für "Display Wachzeit" Sekunden aufwecken (jeder weitere Tipp verlängert)
  - id: wake_if_night
    then:
      - if:
          condition:
            switch.is_on: night_mode
          then:
            - script.execute: night_wake
  - id: night_wake
    mode: restart
    then:
      - lambda: 'id(night_awake) = true;'
      - script.execute: apply_backlight
      - delay: !lambda 'return (uint32_t) (isnan(id(wake_seconds).state) ? 30 : id(wake_seconds).state) * 1000;'
      - lambda: 'id(night_awake) = false;'
      - script.execute: apply_backlight

  - id: answer_timer
    mode: restart
    parameters:
      seconds: int
    then:
      - delay: !lambda 'return seconds * 1000;'
      - lvgl.widget.hide: answer_popup

  - id: question_timer
    mode: restart
    parameters:
      seconds: int
    then:
      - delay: !lambda 'return seconds * 1000;'
      - script.execute:
          id: send_question_answer
          answer: "timeout"

  # Sendet genau ein Event esphome.display_question_answer und schließt den Dialog
  - id: send_question_answer
    mode: queued
    parameters:
      answer: string
    then:
      - if:
          condition:
            lambda: 'return id(q_active);'
          then:
            - lambda: 'id(q_active) = false;'
            - homeassistant.event:
                event: esphome.display_question_answer
                data:
                  device: !lambda 'return App.get_name();'
                  request_id: !lambda 'return id(q_request_id);'
                  answer: !lambda 'return answer;'
            - lvgl.widget.hide: question_popup

  # Volle Kachelansicht: öffnen, nach 60 s ohne Berührung zurück zur Grundansicht
  - id: open_tiles_view
    mode: restart
    then:
      - lvgl.widget.show: tiles_view
      - script.execute: tiles_view_timer
  - id: tiles_view_timer
    mode: restart
    then:
      - delay: 60s
      - lvgl.widget.hide: tiles_view

