# Part of ha-wall-tiles – https://github.com/BlinderOpa/HomeassistantTilesDisplays (MIT)
# Secrets: copy esphome/secrets.example.yaml to secrets.yaml and fill it in.
# Comments in this file are German (original project language).
# ============================================================================
# Wanddisplay 7" (wall-display) - Waveshare ESP32-S3-Touch-LCD-7, 800x480
# Schnittstelle Home Assistant <-> Displays v1.4
#   Grundansicht "Wetterstation" (4.5), immer sichtbar:
#     oben   Außen | Vorhersage heute | Innen
#     Mitte  Uhr + Datum (bei Alarm: rotes Hinweisfeld darüber)
#     unten  Sonnenauf-/untergang, oder bis zu 4 kleine Kacheln (+n)
#   Aktionen: show_answer, show_question, cancel_question, set_tiles, set_background
#   Hintergrund: Wetterbild als JPEG von HA (set_background, Schnittstelle 4.6)
#   Nachtmodus: Beleuchtung aus, Antippen weckt für kurze Zeit (Schnittstelle 4.8)
#   Events:   esphome.display_question_answer, esphome.display_tap, esphome.display_ready
# Daten: nur sensor.ws_* aus dem HA-Package weather_station.yaml
# ============================================================================

substitutions:
  # Override these in your own device file (see esphome/examples/), so the
  # device keeps its existing name and entity ids in Home Assistant.
  node_name: wall-display
  friendly_name: "Wall Display"
  # REQUIRED in your device file (secrets can't be read from a remote package):
  #   api_key, wifi_ssid, wifi_password
  #   e.g.  api_key: !secret my_device_api_key

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0   # OTA-Verschlüsselung (ota: encryption:) gibt es erst ab 2026.9
  project:
    name: "Waveshare.ESP32-S3-touch-lcd-7"
    version: "3.0"
  on_boot:
    priority: -100   # nach allen Komponenten inkl. LVGL
    then:
      - lambda: 'id(boot_done) = true;'
      # Gespeicherten Backlight-/Nachtmodus-Zustand nach Neustart anwenden
      - script.execute: apply_backlight

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80Mhz

logger:

json:

# Für das Hintergrundbild (online_image lädt per HTTP von Home Assistant)
http_request:
  timeout: 20s

# Hintergrundbild: HA wählt und bereitet es auf (800x480, abgedunkelt, Baseline-JPEG)
# und schickt nur die URL (Aktion set_background). Das Gerät zeigt es unverändert an.
# Seit ESPHome 2026.10 ist online_image eine Plattform von image: (das alte Top-Level
# "online_image:" fällt mit 2027.1 weg).
image:
  - platform: online_image
    id: bg_image
    url: "http://127.0.0.1/none.jpg"   # Platzhalter, die echte URL kommt per set_background
    format: JPEG
    type: RGB565
    resize: 800x480
    on_download_finished:
      - lvgl.image.update:
          id: bg_img
          src: bg_image
      - lvgl.widget.show: bg_img
    on_error:
      - logger.log:
          level: WARN
          format: "Hintergrundbild konnte nicht geladen werden"

api:
  encryption:
    key: ${api_key}

  # 4.4 Synchronisation nach Neustart / Wiederverbindung
  on_client_connected:
    - delay: 2s
    - homeassistant.event:
        event: esphome.display_ready
        data:
          device: !lambda 'return App.get_name();'

  actions:
    # ------------------------------------------------------------------
    # 2. show_answer -> Popup über allem
    # ------------------------------------------------------------------
    - action: show_answer
      variables:
        title: string
        value: string
        detail: string
        status: string
        icon: string
        duration: int
      then:
        - lambda: |-
            const std::string s_title(title), s_value(value), s_detail(detail);
            const std::string s_status(status), s_icon(icon);
            uint32_t c = id(status_color)(s_status);
            lv_obj_set_style_border_color(id(answer_box), lv_color_hex(c), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(answer_icon), lv_color_hex(c), LV_PART_MAIN);
            lv_label_set_text(id(answer_icon), id(icon_glyph)(s_icon).c_str());
            lv_label_set_text(id(answer_title), s_title.c_str());
            lv_label_set_text(id(answer_value), s_value.c_str());
            lv_label_set_text(id(answer_detail), s_detail.c_str());
        - lvgl.widget.show: answer_popup
        - script.execute: wake_if_night
        - script.execute:
            id: answer_timer
            seconds: !lambda 'return duration > 0 ? duration : 8;'

    # ------------------------------------------------------------------
    # 3. show_question / cancel_question -> Ja/Nein-Dialog
    # ------------------------------------------------------------------
    - action: show_question
      variables:
        request_id: string
        question: string
        icon: string
        timeout: int
      then:
        # Läuft noch eine andere Frage, wird sie mit "cancelled" beendet
        - if:
            condition:
              lambda: 'return id(q_active);'
            then:
              - script.execute:
                  id: send_question_answer
                  answer: "cancelled"
        - lambda: |-
            const std::string s_icon(icon), s_question(question);
            id(q_request_id) = std::string(request_id);
            id(q_active) = true;
            lv_label_set_text(id(question_icon), id(icon_glyph)(s_icon.empty() ? std::string("help") : s_icon).c_str());
            lv_label_set_text(id(question_text), s_question.c_str());
        - lvgl.widget.show: question_popup
        - script.execute: wake_if_night
        - script.execute:
            id: question_timer
            seconds: !lambda 'return timeout > 0 ? timeout : 30;'

    - action: cancel_question
      variables:
        request_id: string
      then:
        - if:
            condition:
              lambda: 'return id(q_active) && std::string(request_id) == id(q_request_id);'
            then:
              - script.execute:
                  id: send_question_answer
                  answer: "cancelled"

    # ------------------------------------------------------------------
    # 4.2 / 4.5 set_tiles
    #   Grundansicht unten: erste 4 Kacheln klein, "+n" bei mehr
    #   volle Kachelansicht: 12 Slots (4x3)
    #   Alarm-Hinweisfeld über der Uhr, solange eine Kachel "alarm" ist
    # ------------------------------------------------------------------
    - action: set_tiles
      variables:
        tiles: string
      then:
        - lambda: |-
            struct Tile {
              std::string id, status, icon, title, value, detail, tap, mini_icon;
              int progress;
            };
            std::vector<Tile> list;

            const std::string s_tiles(tiles);
            #if ARDUINOJSON_VERSION_MAJOR >= 7
            JsonDocument doc;
            #else
            DynamicJsonDocument doc(8192);
            #endif
            DeserializationError err = deserializeJson(doc, s_tiles);
            if (err) {
              ESP_LOGW("tiles", "set_tiles: JSON-Fehler: %s", err.c_str());
              return;
            }
            for (JsonObject t : doc.as<JsonArray>()) {
              Tile k;
              k.status   = t["status"] | "info";
              if (k.status == "hidden") continue;
              k.id       = t["id"]     | "";
              k.icon     = t["icon"]   | "information";
              k.title    = t["title"]  | "";
              k.value    = t["value"]  | "";
              k.detail   = t["detail"] | "";
              k.tap      = t["tap"]    | "none";
              k.progress = t["progress"] | -1;
              k.mini_icon = t["mini_icon"] | "auto";   // auto | show | hide (v1.6)
              list.push_back(k);
              if (list.size() >= 12) break;
            }
            const size_t n = list.size();

            auto fill = [&](const Tile &k, lv_obj_t *box, lv_obj_t *ico, lv_obj_t *tit,
                            lv_obj_t *val, lv_obj_t *det, lv_obj_t *bar) {
              uint32_t c = id(status_color)(k.status);
              lv_obj_set_style_border_color(box, lv_color_hex(c), LV_PART_MAIN);
              lv_obj_set_style_bg_color(box, lv_color_hex(k.status == "alarm" ? 0x3A1212 : 0x12161B), LV_PART_MAIN);
              lv_obj_set_style_text_color(ico, lv_color_hex(c), LV_PART_MAIN);
              lv_label_set_text(ico, id(icon_glyph)(k.icon).c_str());
              lv_label_set_text(tit, k.title.c_str());
              lv_label_set_text(val, k.value.c_str());
              lv_label_set_text(det, k.detail.c_str());
              if (k.progress >= 0) {
                lv_bar_set_value(bar, k.progress > 100 ? 100 : k.progress, LV_ANIM_OFF);
                lv_obj_set_style_bg_color(bar, lv_color_hex(c), LV_PART_INDICATOR);
                lv_obj_clear_flag(bar, LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(bar, LV_OBJ_FLAG_HIDDEN);
              }
              lv_obj_clear_flag(box, LV_OBJ_FLAG_HIDDEN);
            };

            // Icon zeigen? "show"/"hide" entscheidet die Kachel (mini_icon), "auto": nur wenn der
            // Titel neben dem Icon ganz passt, sonst Titel über die volle Breite
            auto title_layout = [&](const Tile &k, lv_obj_t *ico, lv_obj_t *tit, int32_t full_w) {
              const int32_t beside_w = full_w - 42;
              bool icon_an;
              if (k.mini_icon == "show") icon_an = true;
              else if (k.mini_icon == "hide") icon_an = false;
              else {
                // Textbreite direkt über die Schrift messen (geht auch, wenn die Kachel ausgeblendet ist)
                lv_point_t sz;
                const lv_font_t *font = lv_obj_get_style_text_font(tit, LV_PART_MAIN);
                #if LVGL_VERSION_MAJOR >= 9
                lv_text_get_size(&sz, k.title.c_str(), font, 0, 0, 10000, LV_TEXT_FLAG_NONE);
                #else
                lv_txt_get_size(&sz, k.title.c_str(), font, 0, 0, 10000, LV_TEXT_FLAG_NONE);
                #endif
                icon_an = sz.x <= beside_w;
              }
              if (icon_an) {
                lv_obj_clear_flag(ico, LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_x(tit, 42);
                lv_obj_set_width(tit, beside_w);
              } else {
                lv_obj_add_flag(ico, LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_x(tit, 0);
                lv_obj_set_width(tit, full_w);
              }
            };

            // ---- volle Kachelansicht ----
            lv_obj_t *fb[12] = {id(tile_0), id(tile_1), id(tile_2), id(tile_3), id(tile_4), id(tile_5), id(tile_6), id(tile_7), id(tile_8), id(tile_9), id(tile_10), id(tile_11)};
            lv_obj_t *fi[12] = {id(tile_0_icon), id(tile_1_icon), id(tile_2_icon), id(tile_3_icon), id(tile_4_icon), id(tile_5_icon), id(tile_6_icon), id(tile_7_icon), id(tile_8_icon), id(tile_9_icon), id(tile_10_icon), id(tile_11_icon)};
            lv_obj_t *ft[12] = {id(tile_0_title), id(tile_1_title), id(tile_2_title), id(tile_3_title), id(tile_4_title), id(tile_5_title), id(tile_6_title), id(tile_7_title), id(tile_8_title), id(tile_9_title), id(tile_10_title), id(tile_11_title)};
            lv_obj_t *fv[12] = {id(tile_0_value), id(tile_1_value), id(tile_2_value), id(tile_3_value), id(tile_4_value), id(tile_5_value), id(tile_6_value), id(tile_7_value), id(tile_8_value), id(tile_9_value), id(tile_10_value), id(tile_11_value)};
            lv_obj_t *fd[12] = {id(tile_0_detail), id(tile_1_detail), id(tile_2_detail), id(tile_3_detail), id(tile_4_detail), id(tile_5_detail), id(tile_6_detail), id(tile_7_detail), id(tile_8_detail), id(tile_9_detail), id(tile_10_detail), id(tile_11_detail)};
            lv_obj_t *fp[12] = {id(tile_0_bar), id(tile_1_bar), id(tile_2_bar), id(tile_3_bar), id(tile_4_bar), id(tile_5_bar), id(tile_6_bar), id(tile_7_bar), id(tile_8_bar), id(tile_9_bar), id(tile_10_bar), id(tile_11_bar)};
            for (size_t i = 0; i < 12; i++) {
              if (i < n) {
                fill(list[i], fb[i], fi[i], ft[i], fv[i], fd[i], fp[i]);
                title_layout(list[i], fi[i], ft[i], 164);
                id(tile_ids)[i] = list[i].id;
                id(tile_taps)[i] = list[i].tap;
              } else {
                lv_obj_add_flag(fb[i], LV_OBJ_FLAG_HIDDEN);
                id(tile_ids)[i] = "";
                id(tile_taps)[i] = "none";
              }
            }

            // ---- kleine Kacheln in der Grundansicht ----
            lv_obj_t *mb[4] = {id(mini_0), id(mini_1), id(mini_2), id(mini_3)};
            lv_obj_t *mi[4] = {id(mini_0_icon), id(mini_1_icon), id(mini_2_icon), id(mini_3_icon)};
            lv_obj_t *mt[4] = {id(mini_0_title), id(mini_1_title), id(mini_2_title), id(mini_3_title)};
            lv_obj_t *mv[4] = {id(mini_0_value), id(mini_1_value), id(mini_2_value), id(mini_3_value)};
            lv_obj_t *md[4] = {id(mini_0_detail), id(mini_1_detail), id(mini_2_detail), id(mini_3_detail)};
            lv_obj_t *mp[4] = {id(mini_0_bar), id(mini_1_bar), id(mini_2_bar), id(mini_3_bar)};
            for (size_t i = 0; i < 4; i++) {
              if (i >= n) { lv_obj_add_flag(mb[i], LV_OBJ_FLAG_HIDDEN); continue; }
              fill(list[i], mb[i], mi[i], mt[i], mv[i], md[i], mp[i]);
              title_layout(list[i], mi[i], mt[i], 156);
            }
            if (n > 4) {
              lv_label_set_text(id(mini_more_label), str_sprintf("+%u", (unsigned) (n - 4)).c_str());
              lv_obj_clear_flag(id(mini_more), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(mini_more), LV_OBJ_FLAG_HIDDEN);
            }

            // Ruhezustand (Sonne) nur ohne Kacheln
            if (n == 0) {
              lv_obj_clear_flag(id(sun_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(tiles_view), LV_OBJ_FLAG_HIDDEN);   // nichts mehr zu zeigen
            } else {
              lv_obj_add_flag(id(sun_panel), LV_OBJ_FLAG_HIDDEN);
            }

            // ---- Alarm-Hinweisfeld ----
            const Tile *alarm = nullptr;
            for (auto &k : list) if (k.status == "alarm") { alarm = &k; break; }
            if (alarm != nullptr) {
              lv_label_set_text(id(alarm_icon), id(icon_glyph)(alarm->icon).c_str());
              std::string head = alarm->title;
              if (!alarm->value.empty()) head += "  " + alarm->value;
              lv_label_set_text(id(alarm_title), head.c_str());
              lv_label_set_text(id(alarm_detail), alarm->detail.c_str());
              lv_obj_clear_flag(id(alarm_banner), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(alarm_banner), LV_OBJ_FLAG_HIDDEN);
            }
            ESP_LOGI("tiles", "set_tiles: %u Kacheln, Alarm: %s", (unsigned) n, alarm ? "ja" : "nein");
            id(alarm_active) = (alarm != nullptr);
        # Nachts: Alarm schaltet die Beleuchtung an, bis er weg ist
        - script.execute: apply_backlight

    # ------------------------------------------------------------------
    # 4.6 set_background: Wetter-Hintergrundbild laden, "" = ausblenden
    # ------------------------------------------------------------------
    - action: set_background
      variables:
        url: string
      then:
        - if:
            condition:
              lambda: 'return std::string(url).empty();'
            then:
              - lvgl.widget.hide: bg_img
              - online_image.release: bg_image
            else:
              # set_url startet den Download selbst; danach zeigt on_download_finished das Bild
              - online_image.set_url:
                  id: bg_image
                  url: !lambda 'return std::string(url);'

# OTA verschlüsselt mit dem Schlüssel aus api: encryption: (ab ESPHome 2026.9), kein Passwort nötig
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

# No fallback hotspot – (re)flash via USB if Wi-Fi is wrong.
# To enable it: add  wifi: ap: {password: ...}  and  captive_portal:  in your device file.

# ============================================================================
# Hardware (unverändert)
# ============================================================================

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: false

ch422g:
  - id: ch422g_hub

touchscreen:
  platform: gt911
  id: my_touchscreen
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_release:
    # Ist die Beleuchtung aus, ist LVGL pausiert: der Tipp weckt nur und löst nichts aus.
    - if:
        condition:
          lambda: 'return !id(display_backlight).state;'
        then:
          # von Hand ausgeschaltet -> wieder dauerhaft an
          - switch.turn_on: display_backlight
        else:
          # Nachtmodus: aufwecken bzw. jede Berührung verlängert die Wachzeit
          - script.execute: wake_if_night

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    rotation: 0
    update_interval: never   # LVGL zeichnet selbst neu, wenn sich etwas ändert
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

# ============================================================================
# Display: An/Aus und Nachtmodus
# Backlight hängt an CH422G EXIO2 (nur an/aus, kein PWM, daher keine Helligkeit).
# Der Pin wird vom Display-Treiber belegt, daher direkt über den Expander schalten.
# ============================================================================

switch:
  - platform: template
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Schaltet erst nach dem Statuswechsel, damit apply_backlight den neuen Zustand sieht
    on_turn_on:
      - script.execute: apply_backlight
    on_turn_off:
      - script.execute: apply_backlight

  # Nachtmodus (Schnittstelle 4.8): Beleuchtung aus, Antippen weckt für "Display Wachzeit".
  # Ein-/Ausschalten macht HA (Blueprint display_brightness, Eingabe night_mode_entity).
  - platform: template
    name: "Display Nachtmodus"
    id: night_mode
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.stop: night_wake
      - lambda: 'id(night_awake) = false;'
      - script.execute: apply_backlight
    on_turn_off:
      - script.stop: night_wake
      - lambda: 'id(night_awake) = false;'
      - script.execute: apply_backlight

number:
  - platform: template
    name: "Display Wachzeit"
    id: wake_seconds
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30

# ============================================================================
# Zeit: von HA; SNTP als Rückfall, damit die Uhr auch ohne HA läuft
# ============================================================================

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        then:
          - lvgl.widget.refresh: clock_label
          - lvgl.widget.refresh: date_label

interval:
  # Fallback, falls on_time noch nicht greift (z. B. direkt nach dem Start)
  - interval: 5s
    then:
      - lvgl.widget.refresh: clock_label
      - lvgl.widget.refresh: date_label

# ============================================================================
# Daten der Grundansicht (4.5): ausschließlich sensor.ws_*
# ============================================================================

sensor:
  - platform: homeassistant
    id: ws_aussen_temp
    entity_id: sensor.ws_outdoor_temp
    internal: true
    on_value:
      - lvgl.widget.refresh: out_temp
  - platform: homeassistant
    id: ws_aussen_max
    entity_id: sensor.ws_outdoor_max
    internal: true
    on_value:
      - lvgl.widget.refresh: out_maxmin
  - platform: homeassistant
    id: ws_aussen_min
    entity_id: sensor.ws_outdoor_min
    internal: true
    on_value:
      - lvgl.widget.refresh: out_maxmin
  - platform: homeassistant
    id: ws_aussen_feuchte
    entity_id: sensor.ws_outdoor_humidity
    internal: true
    on_value:
      - lvgl.widget.refresh: out_hum
  - platform: homeassistant
    id: ws_innen_temp
    entity_id: sensor.ws_indoor_temp
    internal: true
    on_value:
      - lvgl.widget.refresh: in_temp
  - platform: homeassistant
    id: ws_innen_feuchte
    entity_id: sensor.ws_indoor_humidity
    internal: true
    on_value:
      - lvgl.widget.refresh: in_hum
  - platform: homeassistant
    id: ws_vh_max
    entity_id: sensor.ws_forecast
    attribute: temp_max
    internal: true
    on_value:
      - lvgl.widget.refresh: fc_maxmin
  - platform: homeassistant
    id: ws_vh_min
    entity_id: sensor.ws_forecast
    attribute: temp_min
    internal: true
    on_value:
      - lvgl.widget.refresh: fc_maxmin

text_sensor:
  # Geräte-Steckbrief für Home Assistant (Schnittstelle 4.10): HA findet das Gerät darüber
  # selbst und weiß, was es kann – keine Zuordnungsliste in display_answer nötig.
  - platform: template
    name: "Display-Info"
    id: display_info
    icon: mdi:card-account-details-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {"node=${node_name};type=wall;size=large;voice=no;tiles=yes"};'

  - platform: homeassistant
    id: ws_komfort
    entity_id: sensor.ws_comfort
    internal: true
    on_value:
      - lambda: |-
          // Smiley-Farbe: gut = grün, Abweichung = bernstein, unbekannt = grau
          uint32_t c = 0x607D8B;
          if (x == "gut") c = 0x81C784;
          else if (x == "trocken" || x == "feucht" || x == "kalt" || x == "warm") c = 0xFFB74D;
          lv_obj_set_style_text_color(id(in_smiley), lv_color_hex(c), LV_PART_MAIN);
      - lvgl.widget.refresh: in_smiley
      - lvgl.widget.refresh: in_komfort
  - platform: homeassistant
