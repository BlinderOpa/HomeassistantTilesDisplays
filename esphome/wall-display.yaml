          hidden: true
          bg_color: 0x000000
          bg_opa: 60%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          on_click:
            - script.stop: answer_timer
            - lvgl.widget.hide: answer_popup
          widgets:
            - obj:
                id: answer_box
                align: CENTER
                width: 600
                height: 320
                bg_color: 0x1A1F25
                bg_opa: COVER
                border_width: 4
                border_color: 0x1E88E5
                radius: 16
                pad_all: 12
                clickable: false
                scrollable: false
                widgets:
                  - label:
                      id: answer_icon
                      align: TOP_MID
                      y: 0
                      text_font: mdi72
                      text: " "
                  - label:
                      id: answer_title
                      align: TOP_MID
                      y: 84
                      width: 560
                      long_mode: DOT
                      height: 24
                      text_align: CENTER
                      text_font: f20
                      text_color: 0x90A4AE
                      text: ""
                  - label:
                      id: answer_value
