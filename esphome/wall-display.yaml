                      long_mode: WRAP
                      text_align: CENTER
                      text_font: f26b
                      text_color: 0xECEFF1
                      text: ""
                  - button:
                      align: BOTTOM_LEFT
                      width: 250
                      height: 72
                      bg_color: 0x43A047
                      radius: 12
                      on_click:
                        - script.stop: question_timer
                        - script.execute:
                            id: send_question_answer
                            answer: "yes"
                      widgets:
                        - label:
                            align: CENTER
                            text_font: f26b
                            text_color: 0xFFFFFF
                            text: "Ja"
                  - button:
                      align: BOTTOM_RIGHT
                      width: 250
                      height: 72
                      bg_color: 0xE53935
                      radius: 12
                      on_click:
                        - script.stop: question_timer
                        - script.execute:
                            id: send_question_answer
                            answer: "no"
                      widgets:
                        - label:
                            align: CENTER
                            text_font: f26b
                            text_color: 0xFFFFFF
                            text: "Nein"

  pages:
    - id: page_wetter
      bg_color: 0x000000
      scrollable: false
      widgets:
        # =============== Hintergrundbild (ganz hinten, erst nach dem Laden sichtbar) ===============
        - image:
            id: bg_img
            x: 0
            y: 0
            src: bg_image
            hidden: true
            clickable: false
        # =============== oben links: Außen ===============
        - obj:
            x: 8
            y: 8
            width: 256
            height: 168
            styles: panel
            scrollable: false
            clickable: false
            widgets:
              - label:
                  x: 0
                  y: 0
                  text_font: f20
                  text_color: 0x90A4AE
                  text: "Außen"
              - label:
                  id: out_temp
                  x: 0
                  y: 24
                  text_font: f64
                  text_color: 0xECEFF1
                  text: !lambda |-
                    return id(fmt_num)(id(ws_aussen_temp).state, 1) + "°";
              - label:
                  id: out_maxmin
                  x: 0
                  y: 96
                  text_font: f20
                  text_color: 0x90A4AE
                  text: !lambda |-
                    return std::string("max ") + id(fmt_num)(id(ws_aussen_max).state, 1) + "°   min "
                           + id(fmt_num)(id(ws_aussen_min).state, 1) + "°";
              - label:
                  x: 0
                  y: 122
                  text_font: mdi20
                  text_color: 0x607D8B
                  text: "\U000F058E"
              - label:
                  id: out_hum
                  x: 26
                  y: 122
                  text_font: f20
                  text_color: 0x90A4AE
                  text: !lambda |-
                    return id(fmt_num)(id(ws_aussen_feuchte).state, 0) + " %";

        # =============== oben Mitte: Vorhersage heute ===============
        - obj:
            x: 272
            y: 8
            width: 256
            height: 168
            styles: panel
            scrollable: false
            clickable: false
            widgets:
              - label:
                  x: 0
                  y: 0
                  text_font: f20
                  text_color: 0x90A4AE
                  text: "Heute"
              - label:
                  id: fc_icon
                  x: 0
                  y: 28
                  text_font: mdi72
                  text_color: 0xB0BEC5
                  text: !lambda |-
                    std::string s = id(ws_vh_symbol).state;
                    if (!id(ws_vh_symbol).has_state() || s.empty()) return std::string(" ");
                    return id(icon_glyph)(s);
              # Text (bis 2 Zeilen) und Max/Min untereinander, Max/Min rutscht automatisch nach
              - obj:
                  x: 84
                  y: 24
                  width: 148
                  height: 96
                  styles: plain
                  scrollable: false
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 2
                  widgets:
                    - label:
                        id: fc_text
                        width: 148
                        long_mode: WRAP
                        text_font: f26b
                        text_color: 0xECEFF1
                        text: !lambda |-
                          std::string s = id(ws_vh_text).state;
                          return (id(ws_vh_text).has_state() && !s.empty()) ? s : std::string("--");
                    - label:
                        id: fc_maxmin
                        text_font: f20
                        text_color: 0x90A4AE
                        text: !lambda |-
                          return id(fmt_num)(id(ws_vh_max).state, 0) + "° / "
                                 + id(fmt_num)(id(ws_vh_min).state, 0) + "°";
              - label:
                  x: 0
                  y: 122
                  text_font: mdi20
                  text_color: 0x607D8B
                  text: "\U000F054B"
              - label:
                  id: fc_rain
                  x: 26
                  y: 122
                  width: 206
                  long_mode: DOT
                  height: 24
                  text_font: f20
                  text_color: 0x90A4AE
                  text: !lambda |-
                    std::string s = id(ws_vh_regen).state;
                    return (id(ws_vh_regen).has_state() && !s.empty()) ? s : std::string("--");

        # =============== oben rechts: Innen (Wohnzimmer) ===============
        - obj:
            x: 536
            y: 8
            width: 256
            height: 168
            styles: panel
            scrollable: false
            clickable: false
            widgets:
              - label:
                  x: 0
                  y: 0
                  text_font: f20
                  text_color: 0x90A4AE
                  text: "Innen"
              - label:
                  id: in_temp
                  x: 0
                  y: 24
                  text_font: f64
                  text_color: 0xECEFF1
                  text: !lambda |-
                    return id(fmt_num)(id(ws_innen_temp).state, 1) + "°";
              - label:
                  id: in_smiley
                  align: TOP_RIGHT
                  x: 0
                  y: 30
                  text_font: mdi48
                  text: !lambda |-
                    std::string k = id(ws_komfort).state;
                    if (!id(ws_komfort).has_state() || k == "unbekannt" || k.empty())
                      return std::string("\U000F01F2");
                    if (k == "gut") return std::string("\U000F01F5");
                    return std::string("\U000F01F6");
                  text_color: 0x607D8B
              - label:
                  id: in_komfort
                  x: 0
                  y: 96
                  text_font: f20
                  text_color: 0x90A4AE
                  text: !lambda |-
                    std::string k = id(ws_komfort).state;
                    if (k == "gut") return std::string("angenehm");
                    if (k == "trocken") return std::string("zu trocken");
                    if (k == "feucht") return std::string("zu feucht");
                    if (k == "kalt") return std::string("zu kühl");
                    if (k == "warm") return std::string("zu warm");
                    return std::string("");
              - label:
                  x: 0
                  y: 122
                  text_font: mdi20
                  text_color: 0x607D8B
                  text: "\U000F058E"
              - label:
                  id: in_hum
                  x: 26
                  y: 122
                  text_font: f20
                  text_color: 0x90A4AE
                  text: !lambda |-
                    return id(fmt_num)(id(ws_innen_feuchte).state, 0) + " %";

        # =============== Mitte: Uhr und Datum ===============
        - label:
            id: clock_label
            align: TOP_MID
            y: 176
            text_font: f120
            text_color: 0xECEFF1
            text: !lambda |-
              auto now = id(now_time)();
              if (!now.is_valid()) return std::string("--:--");
              return str_sprintf("%02d:%02d", now.hour, now.minute);
        - label:
            id: date_label
            align: TOP_MID
            y: 300
            text_font: f26b
            text_color: 0x90A4AE
            text: !lambda |-
              auto now = id(now_time)();
              if (!now.is_valid()) return std::string("");
              static const char *tage[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch",
                                           "Donnerstag", "Freitag", "Samstag"};
              static const char *monate[] = {"Januar", "Februar", "März", "April", "Mai", "Juni",
                                             "Juli", "August", "September", "Oktober",
                                             "November", "Dezember"};
              return str_sprintf("%s, %d. %s", tage[now.day_of_week - 1], now.day_of_month,
                                 monate[now.month - 1]);

